function friendFinder(){
  if(!LAPTOP) return '';
  return `<label class="f" for="ffQ">Already on Split it</label>
    <div class="cbox"><input class="in" id="ffQ" placeholder="@tag or email" autocapitalize="off" autocomplete="off"><button class="btn" id="ffFind">Find</button></div>
    <div id="ffOut" aria-live="polite"></div>
    <button class="btn block" id="ffMine" style="margin-top:8px">Show my friend link and QR code</button>`;
}
function bindFriendFinder(sh, after){
  const q = sh.querySelector('#ffQ'); if(!q) return;
  const out = sh.querySelector('#ffOut');
  const find = async () => { const v = q.value.trim(); if(!v) return;
    try{ const d = await api('/api/people/find', { q:v });
      out.innerHTML = `<div class="card" style="margin-top:8px"><div class="row">${S.people[d.uid]?av(d.uid):''}<div class="body"><div class="t">${esc(d.name)}</div><div class="m">@${esc(d.tag)}</div></div>
        ${d.friend?'<span class="mut">Friends</span>':d.asked?'<span class="mut">Asked</span>':`<button class="btn sm primary" id="ffAsk">Add friend</button>`}</div></div>`;
      const a = out.querySelector('#ffAsk'); if(a) a.onclick = async () => { a.disabled = true;
        try{ const r = await api('/api/friends/request', { to:d.uid }); if(r.friends){ closeSheet(); toast(`You’re friends with ${d.name}`); after ? after(d.uid) : go('friends',{type:'friend',id:d.uid}); } else { a.replaceWith(Object.assign(document.createElement('span'), {className:'mut', textContent:'Asked'})); toast(`Sent. ${d.name} gets a request to accept`); } loadInbox(true); }
        catch(x){ toast(x.message); a.disabled = false; } };
    }catch(x){ out.innerHTML = `<p class="note">${esc(x.message)}</p>`; } };
  sh.querySelector('#ffFind').onclick = find; q.onkeydown = ev => { if(ev.key==='Enter'){ ev.preventDefault(); find(); } };
  sh.querySelector('#ffMine').onclick = () => openFriendLink();
}
async function openFriendLink(fresh){
  let d; try{ d = await api('/api/friends/link', fresh ? { fresh:true } : {}); }catch(x){ toast(x.message); return; }
  const msg = `Add me on Split it: ${d.url}`;
  openSheet(head('Your friend link') + `<p style="margin:0 0 4px">Your tag is <b>@${esc(d.tag)}</b>. Friends on Split it can find you with it.</p>
    <p class="note" style="margin-top:0">Or let them scan this. Anyone on Split it who opens the link becomes your friend right away, so only share it with people you know.</p>
    ${linkBox(d.url, msg, 'Shared it too widely? Make a new link and this one stops working.')}
    <button class="btn block" id="flNew" style="margin-top:4px">Make a new link</button>`, sh => {
    bindLinkBox(sh, d.url, msg);
    sh.querySelector('#flNew').onclick = e => { if(!confirmTap(e.currentTarget, 'Tap again: the old link stops working')) return; openFriendLink(true); };
  });
}
async function drawSentBox(box){
  if(!box) return;
  let inv = []; try{ inv = (await api('/api/invites')).list; }catch(e){}
  await loadInbox(true);
  const stat = { open:'Waiting for them', yes:'Taken over', no:'They said it’s not them', expired:'Expired', undone:'Undone' };
  const rows = [
    ...inv.filter(i=>!i.claim).map(i => `<div class="row"><div class="body"><div class="t">Invite link</div><div class="m">Made ${ago(i.at)}, not used yet</div></div><button class="btn sm" data-inv-x="${esc(i.id)}">Cancel</button></div>`),
    ...S.inbox.freqOut.map(r => `<div class="row">${av(r.uid,'sm')}<div class="body"><div class="t ell">${esc(r.name)}</div><div class="m">Friend request, waiting</div></div><button class="btn sm" data-fr-x="${esc(r.id)}">Take back</button></div>`),
    ...S.inbox.sent.map(c => `<div class="row"><div class="body"><div class="t ell">${esc(c.name)}’s history${c.toName?` → ${esc(c.toName)}`:c.viaLink?' (invite link)':''}</div><div class="m">${stat[c.status]||c.status}</div></div>
      ${c.status==='open'?`<button class="btn sm" data-cl-x="${esc(c.id)}">Cancel</button>`:c.canUndo?`<button class="btn sm" data-cl-undo="${esc(c.id)}">Undo</button>`:''}</div>`),
    ...S.inbox.got.filter(c=>c.canUndo).map(c => `<div class="row"><div class="body"><div class="t ell">History from ${esc(c.byName)}</div><div class="m">You took it over ${ago(c.answeredAt)}</div></div><button class="btn sm" data-cl-undo="${esc(c.id)}">Undo</button></div>`)];
  box.innerHTML = rows.length ? `<label class="f">Sent and waiting</label><div class="card">${rows.join('')}</div>` : '';
  const act = (sel, fn) => box.querySelectorAll(sel).forEach(b => b.onclick = async e => { const t = e.currentTarget;
    if((sel==='[data-cl-undo]') && !confirmTap(t, 'Tap again to undo')) return; t.disabled = true;
    try{ await fn(t); drawSentBox(box); }catch(x){ toast(x.message); t.disabled = false; } });
  act('[data-inv-x]', t => api('/api/invites/cancel', { id:t.dataset.invX }).then(()=>toast('Link cancelled')));
  act('[data-fr-x]', t => api('/api/friends/answer', { id:t.dataset.frX, yes:false }).then(()=>toast('Request taken back')));
  act('[data-cl-x]', t => api('/api/claims/cancel', { id:t.dataset.clX }).then(()=>toast('Cancelled')));
  act('[data-cl-undo]', t => api('/api/claims/undo', { id:t.dataset.clUndo }).then(()=>toast('Undone. Everything is back how it was')));
}
// someone opened your friend link: /#add=TOKEN
async function useFriendLinkFromUrl(){
  const m = location.hash.match(/(?:^#|&)add=([A-Za-z0-9_-]{10,})/); if(!LAPTOP || !m) return;
  history.replaceState(history.state, '', location.pathname);
  try{ const d = await api('/api/friends/link/use', { token:m[1] }); toast(`You’re friends with ${d.name} now`); setTimeout(() => go('friends',{type:'friend',id:d.uid}), 300); }
  catch(x){ toast(x.message); }
}

  return h;

function billPeriod(e){

  if(every==='week') return {unit:'week', label:'the week of '+new Date(e.date+'T12:00').toLocaleDateString('en-CA',{month:'short', day:'numeric'})};

  return {unit:'month', label:monthName(e.date.slice(0,7))};
}

/* ================= bills calendar + .ics ================= */
function calendarItems(gid, from, to){   // bills and chores due between two dates, for my groups (or one group)
  const gs = gid ? [S.groups[gid]] : myGroups(), ids = new Set(gs.map(g=>g.id)), out = [];
  for(const r of S.recurringRaw){ if(r.paused || !ids.has(r.groupId)) continue;
    let key = r.lastPosted ? billNextKey(r, r.lastPosted) : billFirstKey(r), n = 0;
    while(key && n++ < 60){ const d = billDate(r, key); if(d > to) break; if(d >= from) out.push({ date:d, kind:'bill', title:r.title, sub:`${r.variable?'Varies':money(r.amount)}${gid?'':', '+(S.groups[r.groupId]?.name||'')}. ${youOr(r.paidBy)} ${verb(r.paidBy,'pay')}.`, id:r._id, cat:r.category }); key = billNextKey(r, key); } }
  for(const c of S.chores){ if(!ids.has(c.groupId) || !c.due || !Array.isArray(c.order) || !c.order.length) continue;
    let due = c.due, turn = c.turn||0, n = 0;
    while(n++ < 12 && due <= to){ const who = c.order[turn % c.order.length]; if(due >= from) out.push({ date:due, kind:'chore', title:c.title, sub:`${who===myUid?'Your turn':firstName(who)+'’s turn'}${gid?'':', '+(S.groups[c.groupId]?.name||'')}`, id:c._id, mine: who===myUid }); due = nextDate(due, c.every||7); turn++; } }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function icsText(gid){

  const items = calendarItems(gid, today(), addDaysS(today(), 400)), stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';

  for(const it of items){ const d = it.date.replace(/-/g,''), nx = addDaysS(it.date,1).replace(/-/g,'');
    out += `BEGIN:VEVENT\r\nUID:${it.id}-${it.date}@split-it\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${nx}\r\nSUMMARY:${esc2(it.title)}\r\nDESCRIPTION:${esc2(it.sub)}\r\nEND:VEVENT\r\n`; }

function entryList(list, title, grouped){

function rowFor(e, showCtx){

// "54", "$54" or "54.20" finds the $54.20 thing. Whole dollars match any cents.
function amountHit(e, q){
  const m = q.replace(/[$,\s]/g,'').match(/^(\d+)(?:\.(\d{1,2}))?$/); if(!m) return false;
  const a = Math.abs(e.amount||0), vals = [a, e.orig ? Math.abs(e.orig.amount) : null].filter(v=>v!=null);
  if(m[2] != null){ const c = +m[1]*100 + +(m[2].padEnd(2,'0')); return vals.includes(c); }
  return vals.some(v => Math.floor(v/100) === +m[1]);
}

async function mergeInGroup(gid, from, to){
  if(!groupMembers(gid).some(m=>m.id===to)) if(!await write(()=>db.doc(`groups/${gid}/members/${to}`).set({kind:'account', active:true, joinedAt:Date.now(), addedBy:myUid}), true)) return false;
  const sw = x => x===from ? to : x;
  for(const e of groupEntries(gid)){
    if(!e.people.includes(from) && ![e.addedBy,e.editedBy,e.deletedBy].includes(from)) continue;
    const upd = { people: [...new Set(e.people.map(sw))] };
    for(const k of ['paidBy','from','to','addedBy','editedBy','deletedBy']) if(e[k]===from) upd[k]=to;
    if(e.split) upd.split = swapIds(e.split, from, to);
    if(e.splitInput) upd.splitInput = swapInput(e.splitInput, from, to);
    if(!await write(()=>db.doc('expenses/'+e._id).update(upd), true)) return false;
  }
  for(const r of groupBills(gid)) if(r.paidBy===from || JSON.stringify(r.splitInput||{}).includes('"'+from+'"'))
    if(!await write(()=>db.doc('recurring/'+r._id).update({paidBy:sw(r.paidBy), splitMode:r.splitMode, splitInput:swapInput(r.splitInput, from, to)}), true)) return false;
  return await write(()=>db.doc(`groups/${gid}/members/${from}`).delete(), true);
}
async function stripFromBills(gid, id){

    if(inp.shares?.[id]){ delete inp.shares[id]; changed = true; }
    if(inp.exact?.[id]){ toast(`Check ${r.title}: it had a set amount for ${nameOf(id)}`); continue; }
    if(changed) await write(()=>db.doc('recurring/'+r._id).update({splitInput:inp, splitMode:r.splitMode}), true);
  }
}

    sh.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{st.cat=b.dataset.cat;press('data-cat',st.cat);});
    sh.querySelectorAll('[data-pb]').forEach(b=>b.onclick=()=>{st.paidBy=b.dataset.pb;press('data-pb',st.paidBy);check();});
    if($('#twoOn')){
      const drawTwo = () => { $('#twoIn').hidden = !st.two; $('#twoOn').textContent = st.two ? 'Only one person paid' : 'Two people paid';
        $('#twoBox').hidden = st.repeat || st.refund; $('#paid2c').textContent = st.cur==='CAD' ? '$' : st.cur;
        $('#paid2l').textContent = st.paidBy2 ? `How much of it did ${firstName(st.paidBy2)} pay` : 'How much of it did they pay'; press('data-pb2', st.paidBy2); };
      $('#twoOn').onclick = () => { st.two = !st.two; drawTwo(); check(); if(st.two && st.paidBy2) $('#paid2').focus(); };
      sh.querySelectorAll('[data-pb2]').forEach(b=>b.onclick=()=>{ st.paidBy2=b.dataset.pb2; drawTwo(); check(); });
      $('#paid2').oninput = () => { st.paid2 = $('#paid2').value; check(); };
      st.drawTwo = drawTwo; drawTwo(); }
    sh.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ st.mode=b.dataset.mode; if(st.mode==='items' && !st.items.length){ st.items=[{n:$('#ttl').value.trim(), p:$('#amt').value, ids:new Set(act)}]; } drawRows(); });
    sh.querySelectorAll('[data-qs]').forEach(b=>b.onclick=()=>{ const q=b.dataset.qs;
      if(q==='half'){ st.mode='equal'; st.ids=new Set(mem); }
      if(q==='theyowe'){ st.paidBy=myUid; st.mode='equal'; st.ids=new Set([ctx.id]); }
      if(q==='iowe'){ st.paidBy=ctx.id; st.mode='equal'; st.ids=new Set([myUid]); }
      press('data-pb',st.paidBy); drawRows(); });
    $('#cur').onchange = async () => { st.cur = $('#cur').value; if(st.drawTwo) st.drawTwo(); if(st.cur!=='CAD' && !$('#rate').value) $('#rate').value = rememberedRate(st.cur); check();
      if(st.cur!=='CAD' && !st.repeat){ const cur = st.cur, live = await liveRate(cur); if(live && st.cur===cur && sh.isConnected){ $('#rate').value = live.toFixed(4); $('#rate').title = 'Today’s rate (European Central Bank, via frankfurter.app)'; check(); } else if(!$('#rate').value) $('#rate').focus(); } };
    if(tripCur) $('#cur').onchange();   // fetch today's rate for the trip's currency
    $('#rate').oninput = check;
    const chg = $('#chg'); if(chg) chg.onclick = () => pickContext(c => openExpense({...opts, ctx:c, copyOf:null, prefill:{...(pre||{}), title:$('#ttl').value, amount:foreignAmt(), cur:st.cur, cat:st.cat, date:$('#dt').value, note:$('#nt')?.value||'', ai:false, items:null}}), 'Move it to…');
    if($('#rep')) $('#rep').onchange = () => { st.repeat = $('#rep').checked; if(!st.repeat) st.variable=false; syncRepeat(); };
    if($('#var')) $('#var').onchange = () => { st.variable = $('#var').checked; syncRepeat(); };
    press('data-cat',st.cat); press('data-pb',st.paidBy);
    const moreC = $('#moreCats'); if(moreC) moreC.onclick = () => { sh.querySelectorAll('[data-more]').forEach(b => b.hidden = false); moreC.remove(); };
    // guessing a category that is hidden behind More: show it
    const revealCat = () => { const b = sh.querySelector(`[data-cat="${st.cat}"]`); if(b && b.hidden) b.hidden = false; };
    let catPicked = !!(src || bill || pre?.ai);
    sh.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{ catPicked = true; }));
    const showLast = () => { const el = $('#lastHint'); if(!el || st.repeat) { if(el) el.hidden = true; return; }
      const lc = lastCost($('#ttl').value, ex?._id, st.refund); if(!lc){ el.hidden = true; return; }
      const cur = toCents($('#amt').value), diff = cur && lc.last.amount ? Math.round((cur - lc.last.amount) / lc.last.amount * 100) : 0;
      el.hidden = false;
      el.innerHTML = `Last time: <b>${money(lc.last.amount)}</b> on ${esc(dayLabel(lc.last.date))}${lc.avg?`, usually about ${money(lc.avg)}`:''}.`
        + (Math.abs(diff) >= 15 ? ` <span class="${diff>0?'neg':'pos'}">${diff>0?'Up':'Down'} ${Math.abs(diff)}%.</span>` : '')
        + (!cur && st.mode!=='items' ? ` <button class="link" id="useLast">Use ${money(lc.last.amount)}</button>` : '');
      const u = el.querySelector('#useLast'); if(u) u.onclick = () => { $('#amt').value = (lc.last.amount/100).toFixed(2); check(); showLast(); }; };
    $('#amt').addEventListener('input', showLast);
    // Same title as an earlier expense here? Split it the same way, until the person changes the split themselves.
    let splitTouched = !!(src || bill || pre?.ids || pre?.exact || pre?.items), likeFrom = null;
    sh.addEventListener('click', e => { if(e.target.closest('[data-mode],[data-qs],#rows,#itemsBox')) splitTouched = true; }, true);
    sh.addEventListener('input', e => { if(e.target.closest('#rows,#itemsBox')) splitTouched = true; }, true);
    const sameAsBefore = () => {
      if(splitTouched || st.repeat) return;
      const t = $('#ttl').value.trim().toLowerCase(); if(t.length < 3) return;
      const prev = alive(ctxEntries(ctx)).filter(e => e.kind!=='payment' && !e.recurringId && e.splitMode!=='items' && (e.title||'').trim().toLowerCase()===t).sort(byDate)[0];
      const hint = $('#likeHint');
      if(!prev){ if(likeFrom){ likeFrom = null; hint.hidden = true; } return; }
      if(likeFrom === prev._id) return;
      likeFrom = prev._id;
      loadRule(prev.splitMode, prev.splitInput);
      if(st.mode==='equal' && !st.ids.size) st.ids = new Set(act);
      if(!catPicked && prev.category){ st.cat = prev.category; press('data-cat', st.cat); }
      drawRows();
      const how = ({equal:'equally', shares:'by shares', pct:'by %', exact:'by exact amounts'})[st.mode] || 'the same way';
      const who = st.mode==='equal' ? [...st.ids] : Object.keys(input().shares||input().pct||input().exact||{});
      hint.hidden = false;
      hint.innerHTML = `${icon('repeat','tiny')} Split like last time: ${esc(how)}${who.length && who.length < act.length ? ', '+esc(who.map(nameIn).join(', ')) : ''}.`;
    };
    $('#amt').oninput = check; $('#ttl').oninput = () => { showLast(); sameAsBefore(); st.dupOk = false; if(!catPicked){ const g = guessCat($('#ttl').value); if(g){ st.cat = g; press('data-cat', g); revealCat(); } } check(); };
    revealCat();
    syncRepeat(); showLast(); sameAsBefore();
    const drawPhoto = busy => { const b = $('#phBox'); if(!b) return;
      b.innerHTML = busy ? '<span class="note" style="margin:0">Uploading photo…</span>'
        : st.photo ? `<img class="rthumb" src="/api/photo/${esc(st.photo)}" alt="Receipt photo"><button class="btn sm" id="phChange">Change</button><button class="btn sm" id="phDel">Remove</button>`
        : `<button class="btn sm" id="phAdd">${icon('ticket','tiny')} Add a photo</button>`;
      const pick = () => { const f = document.createElement('input'); f.type='file'; f.accept='image/*';
        f.onchange = async () => { const file = f.files?.[0]; if(!file) return; drawPhoto(true);
          try{ st.photo = await uploadPhoto(file); }catch(e){ toast('That photo didn’t upload. Try again'); } drawPhoto(); };
        f.click(); };
      b.querySelector('#phAdd')?.addEventListener('click', pick); b.querySelector('#phChange')?.addEventListener('click', pick);
      b.querySelector('#phDel')?.addEventListener('click', () => { st.photo = null; drawPhoto(); }); };
    drawPhoto();
    if(!st.amount && !st.variable && st.mode!=='items') setTimeout(()=>$('#amt').focus({preventScroll:true}),80);
    $('#save').onclick = async () => {
      const {a, inp, ok} = check(); if(!ok) return;
      const date = $('#dt').value || today(), title = $('#ttl').value.trim().slice(0,60), note = ($('#nt')?.value||'').trim().slice(0,200);
      const cad = cadAmt();
      if(!ex && !bill && !st.repeat && !st.dupOk){
        const near = d => Math.abs(new Date(d+'T12:00:00') - new Date(date+'T12:00:00')) <= 2*864e5;
        const dup = alive(ctxEntries(ctx)).find(e => e.kind!=='payment' && e.amount===cad && near(e.date||'') && ((e.title||'').toLowerCase().split(' ')[0]===title.toLowerCase().split(' ')[0] || e.date===date));
        if(dup){ st.dupOk = true; $('#sn').textContent = `This looks like “${dup.title}” that ${youOrLower(dup.addedBy||dup.paidBy)} added ${dayLabel(dup.date).toLowerCase()}. Tap Save again if it’s a different one.`; $('#sn').className='note bad'; $('#sn').scrollIntoView({block:'center'}); return; }
      }
      if(ex && !st.clashOk){
        const nowE = (ex._priv ? S.privEntries : S.expensesRaw).find(x=>x._id===ex._id);
        if(nowE && (nowE.editedAt||0) !== (ex.editedAt||0) && nowE.editedBy && nowE.editedBy!==myUid){ st.clashOk = true;
          $('#sn').textContent = `${firstName(nowE.editedBy)} changed this ${whenLabel(nowE.editedAt).toLowerCase()}, while you had it open. Saving replaces their change. Tap Save again to keep yours, or close to see theirs.`;
          $('#sn').className='note bad'; $('#sn').scrollIntoView({block:'center'}); return; }
      }
      $('#save').disabled = true;
      if(st.cur!=='CAD') rememberRate(st.cur, rate());
      let done, msg;
      if(st.repeat){
        const data = { groupId:ctx.id, title, amount:st.variable?0:a, variable:st.variable, paidBy:st.paidBy, category:st.cat, splitMode:st.mode, splitInput:inp, day:Number(date.slice(8,10)), every:st.every, month:Number(date.slice(5,7)) };
        if(st.every==='week') data.startDate = date;
        if(bill){ const changedEvery = (bill.every||'month') !== st.every;
          // moved the next due date past the next period (say Dec 1 to Jan 1): skip the periods in between
          const skip = {}; if(!changedEvery && st.every!=='week'){ const k = st.every==='year' ? date.slice(0,4) : date.slice(0,7), nk = nextDue(bill).key;
            if(nk && k > nk) skip.lastPosted = st.every==='year' ? String(+k-1) : prevYm(k); }
          done = await write(() => db.doc('recurring/'+bill._id).update({...data, ...skip, ...(changedEvery || st.every==='week' ? {startMonth:date.slice(0,7), startDate:date, lastPosted:null} : {}), mode:null, weights:null, exact:null, editedBy:myUid})); msg='Bill updated'; }
        else { done = await write(() => db.collection('recurring').doc(newId('r')).set({...data, startMonth:date.slice(0,7), lastPosted:null, paused:false, createdAt:Date.now(), addedBy:myUid})); msg='Bill added'; }
      } else {
        const id = ex ? ex._id : newId('e');
        const fsplit = computeSplit(a, st.mode, inp, id);
        const split0 = st.cur==='CAD' ? fsplit : splitShares(cad, fsplit, id);
        // money in is stored as a negative expense: the same maths, so it comes off everyone's share
        const sign = st.refund ? -1 : 1, split = sign > 0 ? split0 : Object.fromEntries(Object.entries(split0).map(([k,v])=>[k,-v]));
        const body = { title, amount:sign*cad, paidBy:st.paidBy, split, splitMode:st.mode, splitInput:inp, category:st.cat, date, note,
          orig: st.cur==='CAD' ? null : {cur:st.cur, amount:a, rate:rate()}, photo: st.photo || null, people:[...new Set([st.paidBy, ...Object.keys(split)])] };
        const priv = ex ? !!ex._priv : ctxIsPrivate(ctx);
        const ref = priv ? privDoc().collection('entries').doc(id) : db.doc('expenses/'+id);
        if(!ex && st.two && !st.refund){
          // Two people paid: one entry for each of them. Everyone's share is divided between the two in proportion
          // to what each paid, so the balances come out exactly as if it were one bill with two payers.
          const f2 = toCents(st.paid2), b = st.cur==='CAD' ? f2 : Math.min(cad-1, Math.max(1, Math.round(f2*rate()))), id2 = newId('e');
          const s1 = splitShares(cad-b, split, id), s2 = {}; for(const [k,v] of Object.entries(split)) if(v-(s1[k]||0) > 0) s2[k] = v-(s1[k]||0);
          const ref2 = priv ? privDoc().collection('entries').doc(id2) : db.doc('expenses/'+id2);
          const part = (n, by, amt, sp, oa) => ({kind:'expense', ...body, amount:amt, paidBy:by, split:sp, splitMode:'exact', splitInput:{exact:sp}, orig: st.cur==='CAD' ? null : {cur:st.cur, amount:oa, rate:rate()},
            photo: n===1 ? body.photo : null, people:[...new Set([by, ...Object.keys(sp)])], pair:{id, n, total:cad, other: n===1 ? id2 : id},
            ...(priv?{friendId:ctxIds(ctx)[0]}:{groupId:isGroup?ctx.id:null}), createdAt:Date.now()+n-1, addedBy:myUid});
          done = await write(async () => { await ref.set(part(1, st.paidBy, cad-b, s1, a-f2)); await ref2.set(part(2, st.paidBy2, b, s2, f2)); });
          if(done){ closeSheet(); buzz(10); toast('Added as two entries', {label:'Undo', fn:()=>write(async()=>{ await ref.update({deletedAt:Date.now(), deletedBy:myUid}); await ref2.update({deletedAt:Date.now(), deletedBy:myUid}); })});
            if(isGroup) write(()=>db.doc('groups/'+ctx.id).update({lastAt:Date.now()}), true); postDueBills(); } else $('#save').disabled = false;
          return;
        }
        if(ex) { const hist = [...(ex.history||[]).slice(-9), {at: ex.editedAt||ex.createdAt||null, by: ex.editedBy||ex.addedBy||null, amount: ex.amount, title: ex.title, paidBy: ex.paidBy, n: Object.keys(ex.split||{}).length}];
          done = await write(() => ref.update({...body, status:null, editedAt:Date.now(), editedBy:myUid, history:hist})); msg='Changes saved'; }
        else { done = await write(() => ref.set({kind:'expense', ...body, ...(priv?{friendId:ctxIds(ctx)[0]}:{groupId:isGroup?ctx.id:null}), createdAt:Date.now(), addedBy:myUid})); msg=st.refund?'Money in added':'Expense added';
          if(done){ closeSheet(); buzz(10); toast(msg, {label:'Undo', fn:()=>write(()=>ref.update({deletedAt:Date.now(), deletedBy:myUid}))}); postDueBills(); return; } }
        if(done && isGroup) write(()=>db.doc('groups/'+ctx.id).update({lastAt:Date.now()}), true);
      }
      if(done){ closeSheet(); buzz(10); toast(msg); postDueBills(); } else $('#save').disabled = false;
    };
  });
}

/* ================= DETAIL with comments ================= */
function openDetail(id, priv){
  const e = (priv ? S.privEntries : S.expensesRaw).find(x=>x._id===id); if(!e) return;
  const del = !!e.deletedAt, ctx = ctxOf(e);
  const by = (who, when) => `${who?youOrLower(who):'someone'}${when?' '+whenLabel(when):''}`;
  const delNote = del ? `<p class="banner" style="margin:12px 0 0">Deleted by ${esc(by(e.deletedBy, e.deletedAt))}. It doesn’t count toward anyone’s balance.</p>` : '';
  const canTouch = canWrite && (e._priv || e.people.includes(myUid) || (e.groupId && groupMembers(e.groupId).some(m=>m.id===myUid)));
  let body, actions = '';
  if(e.kind==='payment'){
    const party = e._priv || myUid===e.from || myUid===e.to;
    body = `<div class="pair">${av(e.from,'lg')}<span class="mut">→</span>${av(e.to,'lg')}</div>
      <p class="detail-amt">${money(e.amount)}</p><p class="note" style="font-size:.95rem;margin:6px 0 0">${esc(youOr(e.from))} paid ${esc(youOrLower(e.to))} on ${dayLabel(e.date)}, ${esc(ctxLabel(e))}. Logged by ${esc(by(e.addedBy))}.${e.note?' Note: '+esc(e.note)+'.':''}${e.confirmed===false?` Waiting for ${esc(youOrLower(e.to))} to confirm.`:''}</p>${delNote}`;
    if(canWrite && party) actions = del ? '<button class="btn primary" id="res">Restore</button>' : '<button class="btn danger" id="del">Delete payment</button>';
  } else {
    const [,,lab] = catOf(e.category), needs = e.status==='needs_amount';
    const rule = ({shares:'by shares', exact:'by exact amounts', pct:'by percentage', items:'by items'})[e.splitMode] || 'equally';
    const meta = [`${ctxLabel(e)}`, e.orig?`Paid ${fmtCur(e.orig.amount, e.orig.cur)} at 1 ${e.orig.cur} = ${e.orig.rate} CAD`:'', e.pair?`Part ${e.pair.n} of a ${money(e.pair.total)} bill two people paid`:'', `${lab}, ${dayLabel(e.date)}`, e.amount<0 ? `Money in. ${youOr(e.paidBy)} got it, shared ${rule}` : `${youOr(e.paidBy)} paid, split ${rule}`, e.recurringId?'From a monthly bill':'Added by '+by(e.addedBy, e.createdAt), e.editedAt?'Edited by '+by(e.editedBy, e.editedAt):''].filter(Boolean).join('. ');
    body = `<p class="detail-amt">${needs?'Needs amount':e.amount<0?'+'+money(-e.amount):money(e.amount)}</p><p class="note" style="margin:6px 0 0">${esc(meta)}.</p>
      ${e.note?`<p class="banner" style="margin:12px 0 0">${esc(e.note)}</p>`:''}${delNote}
      ${e.photo&&LAPTOP?`<a class="rphoto" href="/api/photo/${esc(e.photo)}" target="_blank" rel="noopener"><img src="/api/photo/${esc(e.photo)}" alt="Receipt photo" loading="lazy"><span>Receipt photo · tap to open</span></a>`:''}
      ${needs?'':`<div class="split">${Object.entries(e.split||{}).map(([mid,c])=>`<div class="srow">${av(mid,'sm')}<span class="nm">${esc(youOr(mid))}</span><span class="share" style="color:var(--ink)">${money(c)}</span></div>`).join('')}</div>`}
      ${e.history?.length?`<label class="f">History</label><div class="split">${e.history.slice().reverse().map(hh=>`<div class="srow"><span class="nm">${esc(hh.title||'')}<br><small class="mut">${hh.by?esc(youOr(hh.by)):'Someone'}${hh.at?' '+esc(whenLabel(hh.at)):''}${hh.n?`, split ${hh.n} way${hh.n===1?'':'s'}`:''}</small></span><span class="share" style="color:var(--ink)">${money(hh.amount||0)}</span></div>`).join('')}</div><p class="note" style="margin-top:4px">What it looked like before each edit, latest first.</p>`:''}
      ${e.splitMode==='items'&&e.splitInput?.items?.length?`<label class="f">Items</label><div class="split">${e.splitInput.items.map(it=>`<div class="srow"><span class="nm">${esc(it.n||'Item')}<br><small class="mut">${it.ids.map(id=>esc(id===myUid?'you':firstName(id))).join(', ')}</small></span><span class="share" style="color:var(--ink)">${fmtCur(it.p, e.orig?.cur)}</span></div>`).join('')}
        ${e.splitInput.tax?`<div class="srow"><span class="nm mut">Tax</span><span class="share">${fmtCur(e.splitInput.tax, e.orig?.cur)}</span></div>`:''}${e.splitInput.tip?`<div class="srow"><span class="nm mut">Tip</span><span class="share">${fmtCur(e.splitInput.tip, e.orig?.cur)}</span></div>`:''}</div>`:''}`;
    if(canTouch) actions = del ? '<button class="btn primary" id="res">Restore</button>' : `${needs?'<button class="btn primary" id="fill">Enter amount</button>':'<button class="btn" id="edit">Edit</button>'}${needs||e.recurringId?'':'<button class="btn" id="dup">Copy</button>'}${needs?'':`<button class="btn favbtn" id="fav" aria-pressed="${!!favOf(e)}">${favOf(e)?'★ Favourite':'☆ Favourite'}</button>`}<button class="btn danger" id="del">Delete</button>`;
  }
  const title = e.kind==='payment' ? 'Settle‑up' : `${catIcon(e.category)} ${esc(e.title)}`;
  const comments = !e._priv;
  openSheet(head(title) + body + (comments?`<label class="f">Comments</label><div class="split" id="cl"><div class="comment"><span class="mut">${e.comments?'Loading…':'No comments yet. Ask about it here instead of the group chat.'}</span></div></div>
    ${canTouch?`<div class="cbox"><label for="ci" class="sr">Add a comment</label><input class="in" id="ci" placeholder="Add a comment" maxlength="300" autocomplete="off"><button class="btn primary" id="cs">Send</button></div>`:''}`:'')
    + (actions?`<div class="foot">${actions}</div>`:''), sh => {
      bindDelete(sh, e); markRead(e);
      const ed = sh.querySelector('#edit'); if(ed) ed.onclick = () => openExpense({existing:e});
      const dp = sh.querySelector('#dup'); if(dp) dp.onclick = () => openExpense({copyOf:e});
      const fv = sh.querySelector('#fav'); if(fv) fv.onclick = async () => { fv.disabled = true; await toggleFav(e); closeSheet(); };
      const fl = sh.querySelector('#fill'); if(fl) fl.onclick = () => fillAmount(e._id);
      if(!comments) return;
      const col = db.collection('expenses/'+e._id+'/comments');
      S.sheetUnsub = col.orderBy('at').limit(200).onSnapshot(s => {
        const cl = sh.querySelector('#cl'); if(!cl) return;
        cl.innerHTML = s.docs.length ? s.docs.map(d => { const c = d.data();
          return `<div class="comment">${av(c.by,'sm')}<div class="body"><div class="who">${esc(youOr(c.by))}, ${esc(whenLabel(c.at))}</div><p>${esc(c.text)}</p></div></div>`; }).join('')
          : `<div class="comment"><span class="mut">No comments yet. Ask about it here instead of the group chat.</span></div>`;
        // two people commenting at once can each count one; the list itself is the true count
        const cur = S.expensesRaw.find(x=>x._id===e._id);
        if(canWrite && cur && s.docs.length > (cur.comments||0) && s.docs.length < 200) write(()=>db.doc('expenses/'+e._id).update({comments:s.docs.length}), true);
      }, () => { const cl = sh.querySelector('#cl'); if(cl) cl.innerHTML = '<div class="comment"><span class="mut">Comments didn’t load.</span></div>'; });
      const cs = sh.querySelector('#cs'), ci = sh.querySelector('#ci');
      if(cs){ const send = async () => { const t = ci.value.trim(); if(!t) return; cs.disabled = true;
          if(await write(async () => { await col.doc(newId('c')).set({by:myUid, text:t.slice(0,300), at:Date.now()}); await db.doc('expenses/'+e._id).update({comments:(e.comments||0)+1}); })){ ci.value=''; e.comments=(e.comments||0)+1; }
          cs.disabled = false; };
        cs.onclick = send; ci.onkeydown = ev => { if(ev.key==='Enter'){ ev.preventDefault(); send(); } }; }
    });
}
function bindDelete(sh, e){
  const ref = entryRef(e);
  const res = sh.querySelector('#res');
  if(res) res.onclick = async () => { if(await write(()=>ref.update({deletedAt:null, deletedBy:null}))){ closeSheet(); toast('Restored'); } };
  const b = sh.querySelector('#del'); if(!b) return;
  b.onclick = async () => {
    if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Tap again to delete'; return; }
    if(await write(() => ref.update({deletedAt:Date.now(), deletedBy:myUid}))){ closeSheet();
      toast('Moved to Recently deleted', {label:'Undo', fn:()=>write(()=>ref.update({deletedAt:null, deletedBy:null}))}); }
  };
}

/* ================= PAYMENTS ================= */
async function recordPayment(ctx, from, to, amount, extra={}){
  const priv = ctxIsPrivate(ctx);
  const recipientConfirms = !priv && to!==myUid && !isGuest(to);
  const data = {kind:'payment', from, to, amount, date:extra.date && extra.date<=today() ? extra.date : today(), note:(extra.note||'').trim().slice(0,80)||null, createdAt:Date.now(), addedBy:myUid, confirmed: !recipientConfirms, people:[from,to]};
  const id = newId('p');
  if(priv) return write(()=>privDoc().collection('entries').doc(id).set({...data, friendId: from===myUid ? to : from}));
  return write(()=>db.doc('expenses/'+id).set({...data, groupId: ctx.type==='group' ? ctx.id : null}));
}
function confirmPay(p, ctx){
  if(!canWrite) return;
  const mine = p.from===myUid || p.to===myUid, other = p.from===myUid ? p.to : p.from;
  openSheet(head(p.from===myUid?'I paid this':p.to===myUid?'I got paid':'Record a payment') + `<div class="pair">${av(p.from,'lg')}<span class="mut">→</span>${av(p.to,'lg')}</div>
    <p class="note" style="font-size:.95rem;margin:0">${esc(youOr(p.from))} paid ${esc(youOrLower(p.to))}, ${esc(ctxTitle(ctx))}</p>
    <label class="f" for="pa">Amount</label><div class="amount-wrap"><span>$</span><input id="pa" inputmode="decimal" value="${(p.amount/100).toFixed(2)}"></div>
    <p class="note" id="pn">${p.to===myUid||(mine&&isGuest(other))||isGuest(p.to)?'Recorded straight away.':`${esc(firstName(p.to))} gets a quick “did you get it?” to confirm.`} Change the amount if only part was paid.</p>
    ${p.from===myUid?etBox(p.to):''}
    <div class="payrow"><div><label class="f" for="pd">When</label><input class="in" id="pd" type="date" value="${today()}" max="${today()}"></div>
      <div><label class="f" for="pnote">Note (optional)</label><input class="in" id="pnote" maxlength="80" placeholder="e-Transfer ref, cash…" autocomplete="off"></div></div>
    <div class="foot"><button class="btn" data-close>Not yet</button><button class="btn primary" id="ok">Save</button></div>`, sh => {
    const pa = sh.querySelector('#pa'), ok = sh.querySelector('#ok'), pn = sh.querySelector('#pn'), base = pn.textContent;
    bindCopy(sh, () => toCents(pa.value));
    pa.oninput = () => { const a = toCents(pa.value); ok.disabled = !a || a > p.amount*2;
      pn.textContent = a > p.amount ? `That’s ${money(a-p.amount)} more than owed, so ${youOrLower(p.to)} would then owe it back.` : base; };
    ok.onclick = async () => { const a = toCents(pa.value); if(!a) return; ok.disabled = true;
      const before = myTotals().net;
      if(await recordPayment(ctx, p.from, p.to, a, {date:sh.querySelector('#pd').value, note:sh.querySelector('#pnote').value})){ closeSheet();
        if(!mine) return toast(p.to!==myUid && !isGuest(p.to) ? `Saved. ${firstName(p.to)} gets asked to confirm` : 'Payment saved');
        celebrate(a>=p.amount ? 'Paid up! Yatta!' : 'Payment saved!', a>=p.amount && before === (p.from===myUid ? -p.amount : p.amount)); } else ok.disabled = false; };
  });
}
function openFriendSettle(fid){
  const parts = friendParts(fid), total = parts.reduce((s,p)=>s+p.amount,0); if(!total) return;
  const sel = new Set(parts.map((p,i)=>i));
  openSheet(head('Settle up with '+esc(firstName(fid))) + `<div class="pair">${av(total>0?fid:myUid,'lg')}<span class="mut">→</span>${av(total>0?myUid:fid,'lg')}</div>
    <p class="detail-amt" id="tot">${money(Math.abs(total))}</p><p class="note" style="font-size:.95rem;margin:4px 0 0">${total>0?esc(firstName(fid))+' pays you':'You pay '+esc(firstName(fid))}</p>
    ${parts.length>1?`<label class="f">What it covers</label><div class="split">${parts.map((p,i)=>`<label class="srow"><span class="nm">${esc(p.label)}</span><span class="share ${amtClass(p.amount)}">${signed(p.amount)}</span><input type="checkbox" data-part="${i}" checked></label>`).join('')}</div>
      <p class="note">Each one is recorded in its own group, so every group’s balance is right.</p>`:''}
    <label class="f" for="pa">Amount paid</label><div class="amount-wrap"><span>$</span><input id="pa" inputmode="decimal" value="${(Math.abs(total)/100).toFixed(2)}"></div>
    <p class="note" id="pn">Change the amount if only part was paid.</p>
    ${total<0?etBox(fid):''}
    <div class="foot"><button class="btn" data-close>Not yet</button><button class="btn primary" id="ok">Record payment</button></div>`, sh => {
    const pa = sh.querySelector('#pa'), ok = sh.querySelector('#ok'), pn = sh.querySelector('#pn');
    const selTotal = () => parts.filter((p,i)=>sel.has(i)).reduce((s,p)=>s+p.amount,0);
    const valid = () => { const a = toCents(pa.value), t = Math.abs(selTotal()); return sel.size && t && a > 0 && a <= t; };
    const upd = () => { const t = selTotal(); sh.querySelector('#tot').textContent = money(Math.abs(t)); ok.disabled = !valid();
      const a = toCents(pa.value); pn.textContent = a > Math.abs(t) ? `That’s more than the ${money(Math.abs(t))} owed.` : a && a < Math.abs(t) ? `Part payment. ${money(Math.abs(t)-a)} will still be owed.` : 'Change the amount if only part was paid.'; };
    bindCopy(sh, () => toCents(pa.value));
    sh.querySelectorAll('[data-part]').forEach(c => c.onchange = () => { c.checked ? sel.add(Number(c.dataset.part)) : sel.delete(Number(c.dataset.part));
      pa.value = (Math.abs(selTotal())/100).toFixed(2); upd(); });
    pa.oninput = upd;
    ok.onclick = async () => { if(!valid()) return; ok.disabled = true; let good = true;
      const t = selTotal(), dir = Math.sign(t), chosen = parts.filter((p,i)=>sel.has(i));
      // Parts going the other way are settled in full, so the money that changes hands is still the amount typed.
      const against = chosen.filter(p => Math.sign(p.amount) !== dir);
      let budget = toCents(pa.value) + against.reduce((s,p)=>s+Math.abs(p.amount),0);
      const plan = against.map(p => [p, Math.abs(p.amount)]);
      for(const p of chosen.filter(p => Math.sign(p.amount) === dir).sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount))){
        const take = Math.min(budget, Math.abs(p.amount)); if(take > 0) plan.push([p, take]); budget -= take; }
      for(const [p, amt] of plan) good = good && await recordPayment(p.ctx, p.amount>0?fid:myUid, p.amount>0?myUid:fid, amt);
      const full = toCents(pa.value) >= Math.abs(t), before = myTotals().net;
      closeSheet(); good ? celebrate(full ? 'All settled! Yatta!' : 'Payment saved!', full && Math.abs(before) === Math.abs(t)) : toast('Some of it didn’t save. Check the balance'); };
  });
}
async function confirmReceived(id, yes){
  const e = alive(S.expensesRaw).find(x=>x._id===id); if(!e || e.to!==myUid) return;
  if(yes){ if(await write(()=>db.doc('expenses/'+id).update({confirmed:true}))) celebrate('Money received!'); }
  else if(await write(()=>db.doc('expenses/'+id).update({deletedAt:Date.now(), deletedBy:myUid}))) toast('Removed. Balances are back to before', {label:'Undo', fn:()=>write(()=>db.doc('expenses/'+id).update({deletedAt:null, deletedBy:null}))});
}

/* ================= CHARTS ================= */
// Each category keeps the same colour everywhere. Categories without a colour fold into grey "Other".
const CAT_SLOT = {groceries:1, food:2, household:3, utilities:4, transport:5, rent:6, internet:7, drinks:8};
const catColor = c => CAT_SLOT[c] ? `var(--s${CAT_SLOT[c]})` : 'var(--s0)';
const kfmt = v => v>=100000 ? '$'+(v/100000).toFixed(v>=1000000?0:1)+'k' : '$'+Math.round(v/100);
const lastMonths = n => { const out = []; let m = ymOf(new Date()); for(let i=0;i<n;i++){ out.unshift(m); m = prevYm(m); } return out; };
const roundTop = (x, y, w, h, r) => { r = Math.min(r, h, w/2); return `M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z`; };
const range = () => { try{ return +localStorage.getItem('hs-range') || 6; }catch(e){ return 6; } };
const setRange = n => { try{ localStorage.setItem('hs-range', String(n)); }catch(e){} };

// Monthly bars, stacked by series, with a dashed line for the average of full months.
function monthBars(months, series, valOf, label){
  const n = months.length, W = 320, H = 150, top = 22, gap = n > 6 ? 6 : 14, bw = (W - gap*(n-1)) / n;
  // a month where refunds beat spending shows as zero, not a bar below the line
  const vals = months.map(m => { const v = {...valOf(m)}; for(const k in v) v[k] = Math.max(0, v[k]); return v; }), tots = vals.map(v => series.reduce((s,x)=>s+(v[x.key]||0),0));
  const max = Math.max(1,...tots), Y = v => H - v/max*(H-top);
  const full = tots.slice(0,-1).filter(t=>t), avg = full.length >= 2 ? Math.round(full.reduce((a,b)=>a+b,0)/full.length) : 0;
  const maxI = tots.indexOf(Math.max(...tots));
  let s = `<svg viewBox="0 0 ${W} ${H+22}" role="img" aria-label="${esc(label)}"><line class="base" x1="0" x2="${W}" y1="${H+.5}" y2="${H+.5}"/>`;
  if(avg) s += `<line class="avg" x1="0" x2="${W}" y1="${Y(avg)}" y2="${Y(avg)}"/>`;
  months.forEach((ym,i) => { const x = i*(bw+gap), t = tots[i];
    if(!t) s += `<rect class="stub" x="${x}" y="${H-2}" width="${bw}" height="2" rx="1"/>`;
    else {
      let yy = H; const segs = series.filter(sr => vals[i][sr.key]/max*(H-top) >= 2.5);
      s += `<g class="bar${i===n-1?' cur':''}" style="--d:${i*45}ms">`;
      segs.forEach((sr,k) => { const h = vals[i][sr.key]/max*(H-top), g = k ? 2 : 0, last = k===segs.length-1;
        s += last ? `<path d="${roundTop(x, yy-h, bw, Math.max(1, h-g), 4)}" fill="${sr.color}"/>` : `<rect x="${x}" y="${yy-h}" width="${bw}" height="${Math.max(1, h-g)}" fill="${sr.color}"/>`;
        yy -= h; });
      s += `</g>`;
      if(n <= 6 || i===n-1 || i===maxI) s += `<text class="val${i===n-1?' cur':''}" x="${x+bw/2}" y="${Y(t)-6}" text-anchor="middle">${kfmt(t)}</text>`;
    }
    if(n <= 6 || (n-1-i) % 2 === 0) s += `<text class="ax" x="${x+bw/2}" y="${H+16}" text-anchor="middle">${monthLabel(ym,true)}</text>`; });
  months.forEach((ym,i) => s += `<rect class="hit" data-ym="${ym}" x="${i*(bw+gap)-gap/2}" y="0" width="${bw+gap}" height="${H+22}"><title>${monthLabel(ym)}: ${money(tots[i])}</title></rect>`);
  return { svg: s + '</svg>', avg, tots, vals };
}
const legendHtml = (series, avg) => `<div class="legend">${series.length > 1 ? series.map(sr=>`<span><i style="background:${sr.color}"></i>${esc(sr.label)}</span>`).join('') : ''}${avg?`<span><i class="dash"></i>Average ${kfmt(avg)}/month</span>`:''}</div>`;
// The chart card: range switch, bars, legend and a line that reads out the tapped month.
function monthCard(id, series, valOf, label, sub){
  const draw = n => { const months = lastMonths(n), c = monthBars(months, series, valOf, label);
    return { html: `${c.svg}${legendHtml(series, c.avg)}`, months, c }; };
  return { draw, html: n => `<div class="card chart" id="${id}"><div class="charttop"><span class="readout" aria-live="polite">${esc(sub||'')}</span>
    <div class="seg mini"><button data-rng="6" aria-pressed="${n===6}">6 mo</button><button data-rng="12" aria-pressed="${n===12}">12 mo</button></div></div>
    <div class="cbody">${draw(n).html}</div><p class="charthint">Tap a month to see what’s in it</p></div><div id="monthBox"></div>` };
}
function bindMonthCard(sh, card, series, entriesFor){
  const box = sh.querySelector('.chart'), body = box.querySelector('.cbody'), read = box.querySelector('.readout');
  let n = range(), cur = card.draw(n);
  const say = ym => { const i = cur.months.indexOf(ym); if(i < 0) return;
    const v = cur.c.vals[i], t = cur.c.tots[i], parts = series.length > 1 ? series.filter(sr=>v[sr.key]).map(sr=>`${sr.label.toLowerCase()} ${money(v[sr.key])}`).join(', ') : '';
    const vs = cur.c.avg && t && i < cur.months.length-1 ? Math.round((t - cur.c.avg)/cur.c.avg*100) : null;
    read.innerHTML = `<b>${esc(monthLabel(ym))}: ${money(t)}</b>${parts?` <span class="mut">(${esc(parts)})</span>`:''}${vs!==null && Math.abs(vs)>=5?` <span class="${vs>0?'neg':'pos'}">${vs>0?'+':''}${vs}% vs average</span>`:''}`; };
  const wire = () => {

  wire();
}

// Running total through the month: this month against last month, with a projection.
function paceData(entriesIn){
  const now = new Date(), cur = ymOf(now), prev = prevYm(cur), day = now.getDate();
  const cum = (ym, upto) => { const by = new Array(32).fill(0); entriesIn(ym).forEach(e => { const d = +(e.date||'').slice(8,10); if(d) by[d] += e.v; });
    const out = [0]; let s = 0; for(let d=1; d<=upto; d++){ s += by[d]; out.push(s); } return out; };
  const a = cum(cur, day), b = cum(prev, daysIn(prev)), total = a[a.length-1], lastTotal = b[b.length-1];
  const proj = day >= 5 && total ? Math.round(total / day * daysIn(cur)) : null;
  return { a, b, cur, prev, day, total, lastTotal, proj, sameDay: b[Math.min(day, b.length-1)] };
}
function paceSvg(p){
  const W = 320, H = 120, top = 12, max = Math.max(1, p.total, p.lastTotal, p.proj||0);
  const X = d => d/31*W, Y = v => H - Math.max(0, v)/max*(H-top);
  const path = arr => arr.map((v,d)=>`${d?'L':'M'}${X(d).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  let s = `<svg viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Spending so far this month compared with last month"><line class="base" x1="0" x2="${W}" y1="${H+.5}" y2="${H+.5}"/>`;
  s += `<path class="ln prev" d="${path(p.b)}"/>`;
  if(p.proj) s += `<line class="ln proj" x1="${X(p.day)}" y1="${Y(p.total)}" x2="${X(daysIn(p.cur))}" y2="${Y(p.proj)}"/>`;
  s += `<path class="ln now" pathLength="1" d="${path(p.a)}"/><circle class="dot" cx="${X(p.day)}" cy="${Y(p.total)}" r="4.5"/>`;
  [1,10,20,31].forEach(d => s += `<text class="ax" x="${Math.min(W-6, Math.max(6, X(d)))}" y="${H+15}" text-anchor="middle">${d}</text>`);
  s += `<line class="xh" x1="0" x2="0" y1="0" y2="${H}" hidden/><rect class="track" x="0" y="0" width="${W}" height="${H+20}"/></svg>`;
  return s;
}
function paceCard(p, what){
  if(!p.total && !p.lastTotal) return '';
  const vs = p.sameDay && p.day >= 5 ? Math.round((p.total - p.sameDay)/p.sameDay*100) : null;
  return `<label class="f">This month so far</label><div class="card chart pace"><div class="charttop"><span class="readout" aria-live="polite">${p.proj
      ? `On pace for about <b>${money(p.proj)}</b> ${esc(what)}`
      : `<b>${money(p.total)}</b> so far`}${vs!==null && Math.abs(vs)>=5 ? `, <span class="${vs>0?'neg':'pos'}">${vs>0?'+':''}${vs}%</span> vs this point last month` : ''}.</span></div>
    ${paceSvg(p)}<div class="legend"><span><i style="background:var(--cv1)"></i>${monthName(p.cur)}</span><span><i class="dash" style="border-color:var(--muted)"></i>${monthName(p.prev)}</span>${p.proj?`<span><i class="dash"></i>Projection</span>`:''}</div></div>`;
}
// Drag or hover across a line chart to read the value for that day.
function bindTrack(sh, sel, readFor){
  sh.querySelectorAll(sel).forEach(card => { const svg = card.querySelector('svg'), tr = svg?.querySelector('.track'), xh = svg?.querySelector('.xh'), out = card.querySelector('.readout');
    if(!tr) return; const base = out.innerHTML;
    const move = e => { const r = svg.getBoundingClientRect(), x = Math.max(0, Math.min(1, (e.clientX - r.left)/r.width)), res = readFor(x);
      if(!res){ return; } xh.hidden = false; xh.setAttribute('x1', res.x); xh.setAttribute('x2', res.x); out.innerHTML = res.html; };
    const leave = () => { xh.hidden = true; out.innerHTML = base; };
    tr.addEventListener('pointerdown', e => { tr.setPointerCapture?.(e.pointerId); move(e); });
    tr.addEventListener('pointermove', move); tr.addEventListener('pointerup', () => setTimeout(leave, 1600)); tr.addEventListener('pointerleave', e => { if(e.pointerType==='mouse') leave(); });
  });
}
const paceRead = p => x => { const d = Math.round(x*31); if(d < 1) return null;
  const a = d <= p.day ? p.a[d] : null, b = p.b[Math.min(d, p.b.length-1)];
  return { x: d/31*320, html: `<b>${monthLabel(p.cur,true)} ${d}</b>: ${a!==null?money(a):'—'} <span class="mut">vs ${money(b)} by ${monthLabel(p.prev,true)} ${Math.min(d, p.b.length-1)}</span>` }; };

// One whole split into a few parts: a single segmented bar, coloured by category.
function catStrip(cats){
  cats = posCats(cats);
  const tot = sumOf(cats); if(!tot) return { html:'', shown:new Set() };
  const rows = Object.entries(cats).sort((a,b)=>b[1]-a[1]), shown = new Set(); let other = 0;
  const segs = [];
  rows.forEach(([c,v]) => { if(CAT_SLOT[c] && segs.length < 5){ segs.push([c,v]); shown.add(c); } else other += v; });
  if(other) segs.push(['_other', other]);
  return { shown, html: `<div class="catstrip" role="img" aria-label="${esc(segs.map(([c,v])=>`${c==='_other'?'Other':catOf(c)[2]} ${Math.round(v/tot*100)}%`).join(', '))}">${segs.map(([c,v],i)=>
    `<i style="flex-grow:${v};background:${c==='_other'?'var(--s0)':catColor(c)};--d:${i*70}ms"></i>`).join('')}</div>` };
}
const posCats = cats => Object.fromEntries(Object.entries(cats).filter(([,v]) => v > 0));

  return `<div class="row"><span class="ic">${icon(icn)}</span><div class="body"><div class="t"><i class="sw" style="background:${col}"></i>${lab}</div><div class="bar"><i style="background:${col};width:${v/tot*100}%"></i></div></div><div class="r"><b>${money(v)}</b><small class="mut">${Math.round(v/tot*100)}%</small></div></div>`; }).join(''));

// A little trend line for a tile.
function sparkline(vals){
  const W = 64, H = 18, max = Math.max(1,...vals), n = vals.length;
  if(vals.filter(Boolean).length < 2) return '';
  const pts = vals.map((v,i)=>[i/(n-1)*W, H-2 - v/max*(H-4)]);
  return `<svg class="spark" viewBox="-3 -3 ${W+6} ${H+6}" aria-hidden="true"><path pathLength="1" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}"/><circle cx="${pts[n-1][0]}" cy="${pts[n-1][1]}" r="2.6"/></svg>`;
}

// Your running balance in a group: above the line you're owed, below it you owe.
function balanceSeries(gid){
  const list = counts(groupEntries(gid)).filter(e => !(e.kind==='payment' && e.confirmed===false)).sort((a,b)=>(a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
  const delta = e => e.kind==='payment' ? (e.from===myUid ? e.amount : 0) - (e.to===myUid ? e.amount : 0) : (e.paidBy===myUid ? e.amount : 0) - ((e.split||{})[myUid]||0);
  const start = addDays(today(), -180); let v = 0, startVal = 0; const pts = [];
  list.forEach(e => { const d = delta(e); if(!d) return; v += d; if((e.date||'') < start) startVal = v; else pts.push([e.date, v]); });
  return { pts, start, startVal, now: v };
}
function balanceCard(gid){
  const b = balanceSeries(gid); if(b.pts.length < 2) return null;
  const W = 320, H = 110, d0 = new Date(b.start+'T12:00:00'), span = (new Date(today()+'T12:00:00') - d0) || 1;
  const xs = b.pts.map(p => (new Date(p[0]+'T12:00:00') - d0)/span*W);
  const vals = b.pts.map(p=>p[1]), lo = Math.min(0, b.startVal, ...vals), hi = Math.max(0, b.startVal, ...vals), rng = (hi-lo)||1;
  const Y = v => 8 + (hi - v)/rng*(H-16), z = Y(0);
  // a step line: the balance holds until the next entry
  let d = `M0 ${Y(b.startVal).toFixed(1)}`; xs.forEach((x,i) => { d += `H${x.toFixed(1)}V${Y(vals[i]).toFixed(1)}`; }); d += `H${W}`;
  const area = d + `V${z}H0Z`;
  const last = vals[vals.length-1];
  const s = `<svg viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Your balance in this group over the last six months">
    <defs><clipPath id="bAbove"><rect x="0" y="0" width="${W}" height="${z}"/></clipPath><clipPath id="bBelow"><rect x="0" y="${z}" width="${W}" height="${H}"/></clipPath></defs>
    <path class="area up" d="${area}" clip-path="url(#bAbove)"/><path class="area down" d="${area}" clip-path="url(#bBelow)"/>
    <line class="zero" x1="0" x2="${W}" y1="${z}" y2="${z}"/><path class="ln bal" pathLength="1" d="${d}"/>
    <circle class="dot ${last>=0?'up':'down'}" cx="${W-4}" cy="${Y(last)}" r="4.5"/>
    <text class="ax" x="0" y="${H+15}">${esc(new Date(b.start+'T12:00:00').toLocaleDateString('en-CA',{month:'short'}))}</text><text class="ax" x="${W}" y="${H+15}" text-anchor="end">Today</text>
    <line class="xh" x1="0" x2="0" y1="0" y2="${H}" hidden/><rect class="track" x="0" y="0" width="${W}" height="${H+20}"/></svg>`;
  return { html: `<label class="f">Your balance here, last 6 months</label><div class="card chart balc"><div class="charttop"><span class="readout" aria-live="polite">${last>0?`You’re owed <b class="pos">${money(last)}</b> now`:last<0?`You owe <b class="neg">${money(-last)}</b> now`:'You’re even now'}. Above the line you’re owed, below it you owe.</span></div>${s}</div>`,
    read: x => { const t = x*W; let i = -1; xs.forEach((xx,k) => { if(xx <= t) i = k; });
      const v = i < 0 ? b.startVal : vals[i], when = i < 0 ? b.start : b.pts[i][0];
      return { x: t, html: `<b>${esc(dayLabel(when))}</b>: ${v>0?`owed <b class="pos">${money(v)}</b>`:v<0?`owe <b class="neg">${money(-v)}</b>`:'even'}` }; } };
}

// Splitwise exports: Date, Description, Category, Cost, Currency, then one column per person with their net
// for that row (what they paid minus their share). Payments are rows with Category "Payment".
function parseCsv(txt){
  const rows = [], re = /("([^"]|"")*"|[^,\r\n]*)(,|\r?\n|$)/g; let row = [], m;
  txt = txt.replace(/^\uFEFF/, '');
  while((m = re.exec(txt)) && m[0] !== ''){ let v = m[1]; if(v.startsWith('"')) v = v.slice(1,-1).replace(/""/g,'"'); row.push(v); if(m[3] !== ','){ rows.push(row); row = []; } if(m.index + m[0].length >= txt.length) break; }
  return rows.filter(r => r.length > 1 || (r[0]||'').trim());
}

async function uploadPhoto(file){
  // Shrink on the phone first so uploads are quick and the laptop disk stays small.
  const bmp = await createImageBitmap(file, {imageOrientation:'from-image'}).catch(() => createImageBitmap(file));
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .8));
  const r = await fetch('/api/photo', {method:'POST', headers:{'Content-Type':'image/jpeg'}, body:blob});
  if(!r.ok) throw new Error('upload failed');
  return (await r.json()).id;
}

function localParse(raw){
  let t = ' ' + String(raw||'').replace(/\s+/g,' ').trim() + ' ';
  const low = () => t.toLowerCase();
  const cut = re => { const m = t.match(re); if(m) t = t.replace(re, ' '); return m; };
  const out = { currency:'CAD', items:null, tax:0, tip:0, where:'', title:'', amount:0, paidBy:myUid, category:null, date:today(), participants:[], exact:null, repeatMonthly:false };
  // currency
  const CUR_WORDS = [['USD',/\b(usd|us\$|us dollars?)\b/i],['EUR',/€|\b(eur|euros?)\b/i],['GBP',/£|\b(gbp|pounds?)\b/i],['INR',/₹|\b(inr|rupees?|rs\.?)\b/i],['MXN',/\b(mxn|pesos?)\b/i],['AUD',/\b(aud|aussie dollars?)\b/i]];
  for(const [c,re] of CUR_WORDS) if(re.test(t)){ out.currency = c; t = t.replace(re,' '); break; }
  t = t.replace(/\b(cad|bucks?|dollars?)\b/ig,' ');
  // monthly
  if(cut(/\b(every month|each month|monthly|per month|a month)\b/i)) out.repeatMonthly = true;
  // dates
  const d0 = new Date(); const back = n => { const d = new Date(); d.setDate(d.getDate()-n); return dateStr(d); };
  let m;
  if(cut(/\b(today|tonight|this morning)\b/i)) out.date = today();
  else if(cut(/\b(yesterday|last night)\b/i)) out.date = back(1);
  else if((m = cut(/\b(\d+) days? ago\b/i))) out.date = back(Math.min(60, +m[1]));
  else if((m = cut(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/))) out.date = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  else {
    const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const MON = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    if((m = cut(/\b(?:on |last )?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?:day|nesday|sday|urday)?\b/i))){
      const i = DAYS.findIndex(x => x.startsWith(m[1].toLowerCase().slice(0,3)));
      let n = (d0.getDay() - i + 7) % 7; if(n===0) n = 7; out.date = back(n);
    } else if((m = cut(/\b(?:on )?(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.? (\d{1,2})(?:st|nd|rd|th)?\b/i)) || (m = cut(/\b(?:on )?(\d{1,2})(?:st|nd|rd|th)? (jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\b/i))){
      const [mo, dy] = isNaN(+m[1]) ? [m[1], +m[2]] : [m[2], +m[1]];
      const mi = MON.indexOf(mo.toLowerCase().slice(0,3)); let y = d0.getFullYear();
      if(new Date(y, mi, dy) > d0) y--; if(mi>=0 && dy>=1 && dy<=31) out.date = `${y}-${pad(mi+1)}-${pad(dy)}`;
    }
  }
  // people we know: everyone in my groups and my friends
  const known = new Map();
  const addP = id => { if(!id || id===myUid) return; const full = nameOf(id).toLowerCase(), first = full.split(' ')[0];
    if(first.length>1){ if(!known.has(full)) known.set(full, id); if(!known.has(first)) known.set(first, id); } };
  myGroups().forEach(g => activeIn(g.id).forEach(x => addP(x.id))); friendIds().forEach(addP);
  const reName = n => new RegExp('(^|[^a-z])' + n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + "(?:'s)?(?=[^a-z]|$)", 'i');
  const findPeople = s => { const ids = []; [...known.keys()].sort((a,b)=>b.length-a.length).forEach(n => { if(reName(n).test(s) && !ids.includes(known.get(n))) ids.push(known.get(n)); }); return ids; };
  // "X owes me 20"
  let owesMe = null;
  if((m = t.match(/^(.*?)\bowes? (me|us)\b(.*)$/i))){ const ids = findPeople(m[1]); if(ids.length){ owesMe = ids; t = ' ' + m[1].replace(reName(nameOf(ids[0]).split(' ')[0].toLowerCase()),' ') + ' ' + m[3] + ' '; } }
  // "except X"
  let except = [];
  if((m = t.match(/\b(?:except|but not|without|minus|not incl(?:uding)?)\b(.*)$/i))){ except = findPeople(m[1]); if(except.length) t = t.slice(0, m.index) + ' '; }
  // "paid by X" / "X paid"
  let payer = null;
  if((m = t.match(/\b(?:paid by|paid for by)\s+([a-z][a-z'-]*)/i)) || (m = t.match(/\b([a-z][a-z'-]*)\s+(?:paid|covered|got it|bought)\b/i))){
    const w = m[1].toLowerCase();
    if(['i','me'].includes(w)) payer = myUid; else { const ids = findPeople(' '+w+' '); if(ids.length) payer = ids[0]; }
    if(payer) t = t.replace(m[0],' ');
  }
  // tax / tip
  if((m = cut(/\b(?:\+|plus )?tip\s*\$?(\d+(?:[.,]\d{1,2})?)\b/i))) out.tip = +m[1].replace(',','.');
  if((m = cut(/\b(?:\+|plus )?tax\s*\$?(\d+(?:[.,]\d{1,2})?)\b/i))) out.tax = +m[1].replace(',','.');
  // "2 x 15" means 30
  if((m = cut(/\b(\d{1,2})\s*[x×*]\s*\$?(\d+(?:[.,]\d{1,2})?)\b/i))) out.amount = Math.round(+m[1] * +m[2].replace(',','.') * 100) / 100;
  // amount: the last money-looking number
  const nums = [...t.matchAll(/(?:[$€£₹]\s?)?(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:[.,]\d{1,2})?)(?:\s?[$€£₹])?(?![\d:])/g)].filter(x => !/\d+(st|nd|rd|th)/i.test(t.slice(x.index, x.index+x[0].length+2)));
  // numbers that are times or head counts, not money: "7pm", "7:30", "split 3 ways", "for 4", "3 people", "4 of us"
  const notMoney = [/\b\d{1,2}(?::\d\d)?\s?(?:am|pm)\b/ig, /\b\d{1,2}:\d\d\b/g, /:\s*\d+/g, /\b\d+\s*(?:ways?|people|persons?|ppl|of us|guys|roommates|housemates)\b/ig,
    /\b(?:split|divided|between|among|for)\s+\d{1,2}(?![\d.,])(?!\s*[$€£₹])(?=\s|$)/ig];
  const skip = []; for(const re of notMoney) for(const x of t.matchAll(re)) skip.push([x.index, x.index + x[0].length]);
  const inSkip = x => { const a = x.index + x[0].search(/\d/); return skip.some(([s,e]) => a >= s && a < e); };
  const money = nums.filter(x => !inSkip(x));
  if(money.length) nums.splice(0, nums.length, ...money);
  if(nums.length && !out.amount){ const pick = nums.find(x => /[$€£₹]/.test(x[0])) || nums.find(x => /[.,]\d{1,2}$/.test(x[1]) && !/,\d{3}$/.test(x[1])) || nums[nums.length-1];
    out.amount = +pick[1].replace(/,(?=\d{3})/g,'').replace(',','.'); t = t.slice(0,pick.index) + ' ' + t.slice(pick.index+pick[0].length); }
  for(const re of notMoney) t = t.replace(re, ' ');
  if(out.amount && (out.tax || out.tip) && !/total/i.test(raw)) out.amount = Math.round((out.amount + out.tax + out.tip)*100)/100;
  // who it's with
  let named = owesMe || findPeople(t);
  // group named by its name?
  const groups = myGroups();
  let g = groups.find(x => x.name && x.name.length>2 && reName(x.name.toLowerCase()).test(t));
  if(g) t = t.replace(reName(g.name.toLowerCase()), ' ');
  const everyone = /\b(everyone|everybody|all of us|the house|house|split it|whole house|roommates|housemates)\b/i.test(t);
  if(!g && (named.length >= 2 || everyone || (named.length === 0 && groups.length === 1))){
    const fits = groups.filter(x => named.every(id => activeIn(x.id).some(mm=>mm.id===id)));
    if(fits.length === 1 || (fits.length && everyone && groups.length===1)) g = fits[0];
    else if(fits.length > 1 && named.length) g = fits.sort((a,b)=>activeIn(a.id).length-activeIn(b.id).length)[0];
  }
  if(g){
    out.where = 'g:'+g.id; const mem = activeIn(g.id).map(x=>x.id);
    let ps = (named.length && !everyone) ? [myUid, ...named.filter(id=>mem.includes(id))] : mem;
    if(owesMe) ps = named.filter(id=>mem.includes(id));
    out.participants = [...new Set(ps)].filter(id => !except.includes(id));
  } else if(named.length === 1 && friendIds().includes(named[0]) && !isGuestOnly(named[0])){
    out.where = 'f:'+named[0]; out.participants = owesMe ? [named[0]] : [myUid, named[0]];
  }
  if(payer) out.paidBy = payer;
  // title: what's left, minus filler words and names
  for(const id of named.concat(except)) [nameOf(id).toLowerCase(), nameOf(id).split(' ')[0].toLowerCase()].forEach(n => { t = t.replace(new RegExp(reName(n).source,'ig'),'$1 '); });
  t = t.replace(/[$€£₹]/g,' ').replace(/\b(with|for|and|at|on|from|to|the|i|me|my|we|us|paid|spent|split|it|everyone|everybody|all of us|whole house|roommates|housemates|between|each|total|was|of|a|an)\b/ig,' ')

  return out;
}

/* ================= receipt reading on the phone itself (Tesseract.js, no AI, no account) ================= */
let tessP = null;
const loadTesseract = () => tessP || (tessP = new Promise((res, rej) => { if(window.Tesseract) return res(window.Tesseract);
  const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; sc.onload = () => res(window.Tesseract); sc.onerror = () => { tessP = null; rej(new Error('load')); }; document.head.appendChild(sc); }));
function parseReceipt(text){
  const lines = text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const num = l => { const m = l.replace(/,(\d{2})\b/g,'.$1').match(/(\d+\.\d{2})\s*[A-Z]?\s*$/); return m ? parseFloat(m[1]) : null; };
  let total = null;
  for(const l of lines) if(/\b(total|amount due|balance due|grand total|to pay)\b/i.test(l) && !/sub\s*total/i.test(l)){ const v = num(l); if(v!=null) total = v; }
  if(total==null){ const vals = lines.map(num).filter(v=>v!=null); total = vals.length ? Math.max(...vals) : 0; }
  let tax = 0, tip = 0;
  for(const l of lines){ if(/\b(hst|gst|pst|qst|tvq|tps|tax)\b/i.test(l) && !/total/i.test(l)){ const v = num(l); if(v!=null) tax += v; } if(/\b(tip|gratuity|pourboire)\b/i.test(l)){ const v = num(l); if(v!=null) tip = v; } }
  let date = today();
  for(const l of lines){ let m = l.match(/(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if(m){ date = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`; break; }
    m = l.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/); if(m){ const y = m[3].length===2 ? '20'+m[3] : m[3], a = +m[1], b = +m[2], [mo, da] = a > 12 ? [b, a] : [a, b]; if(mo>=1 && mo<=12 && da>=1 && da<=31){ date = `${y}-${pad(mo)}-${pad(da)}`; break; } } }
  if(date > today()) date = today();
  const skip = /total|tax|hst|gst|pst|qst|tip|gratuity|change|cash|visa|debit|master|credit|balance|amount|approved|card|auth|interac|tendered|savings|points|subtotal/i;
  const title = (lines.find(l => /[A-Za-z]{3,}/.test(l) && !/\d{3,}/.test(l) && !/receipt|invoice|welcome|thank|store|tel|www|\.com/i.test(l)) || 'Receipt').replace(/[^A-Za-z0-9&'’ .-]/g,' ').replace(/\s+/g,' ').trim().slice(0,40);
  const items = [];
  for(const l of lines){ const v = num(l); if(v==null || v<=0 || skip.test(l)) continue;
    const name = l.replace(/(\d+[.,]\d{2})\s*[A-Z]?\s*$/,'').replace(/^\d+\s*[xX@]?\s*/,'').replace(/[^A-Za-z0-9&'’ .%-]/g,' ').replace(/\s+/g,' ').trim();
    if(name.length >= 2 && v <= (total||Infinity)) items.push({name:name.slice(0,40), price:v}); }
  const useItems = items.length >= 2 && Math.abs(items.reduce((a,i)=>a+i.price,0) + tax + tip - total) <= Math.max(1, total*0.08);
  return { title: title.charAt(0).toUpperCase()+title.slice(1), amount: total, date, tax: useItems?tax:0, tip: useItems?tip:0, items: useItems ? items : null, category: /restaurant|pizza|sushi|grill|cafe|bistro|bar\b/i.test(text) ? 'food' : 'groceries', where:'' };
}
async function ocrReceipt(file){
  const st = { stop:false };
  openSheet(head('Reading your receipt') + `<p class="note" id="ocrMsg" style="font-size:1rem;margin:0">Getting the reader ready…</p><div class="ocrbar"><i id="ocrBar" style="width:4%"></i></div>
    <p class="note">This happens on your phone. The photo isn’t sent to any AI. Check what it finds before saving.</p><div class="foot"><button class="btn" id="stop">Cancel</button></div>`, sh => sh.querySelector('#stop').onclick = () => { st.stop = true; closeSheet(); });
  const say = (m, p) => { const el = document.getElementById('ocrMsg'), b = document.getElementById('ocrBar'); if(el) el.textContent = m; if(b && p!=null) b.style.width = Math.round(p)+'%'; };
  let worker = null;
  try{
    const T = await loadTesseract(); if(st.stop) return;
    const bmp = await createImageBitmap(file, {imageOrientation:'from-image'}).catch(()=>createImageBitmap(file));
    const k = Math.min(1, 1800/Math.max(bmp.width, bmp.height)), c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    const x = c.getContext('2d'); x.filter = 'grayscale(1) contrast(1.25)'; x.drawImage(bmp, 0, 0, c.width, c.height);
    say('Loading the reader (first time takes a moment)…', 10);
    worker = await T.createWorker('eng', 1, { logger: m => { if(m.status==='recognizing text') say('Reading…', 30 + m.progress*70); } });
    if(st.stop) return;
    const { data } = await worker.recognize(c);
    if(st.stop) return;
    const d = parseReceipt(data.text || '');
    let photo = null; if(LAPTOP){ say('Saving the photo…', 100); try{ photo = await uploadPhoto(file); }catch(e){} }
    const { prefill } = cleanAi(d); prefill.receipt = true; prefill.photo = photo; prefill.ai = true;
    if(!prefill.amount) prefill.title = prefill.title || 'Receipt';
    closeSheet();
    const ctx = S.page?.type==='group' ? {type:'group', id:S.page.id} : null;
    if(ctx) openExpense({ctx, prefill}); else pickContext(c2 => openExpense({ctx:c2, prefill}), 'Who’s this receipt with?');
  } catch(e){ console.error(e); if(!st.stop){ closeSheet(); toast(window.Tesseract ? 'Couldn’t read that photo. Try a flatter, brighter shot' : 'Receipt reading needs internet the first time'); } }
  finally{ try{ worker && worker.terminate(); }catch(e){} }
}

    for(const r of S.recurringRaw){
      if(r.paused || !r.groupId || !r.paidBy || !activeIn(r.groupId).some(m=>m.id===myUid)) continue;
      let key = r.lastPosted ? billNextKey(r, r.lastPosted) : billFirstKey(r), last = null, n = 0;
      while(key && n < 6){
        const date = billDate(r, key);
        if(date > td) break;
        const id = 'r_'+r._id+'_'+key, base = { kind:'expense', groupId:r.groupId, title:r.title, paidBy:r.paidBy, category:r.category, date,
          splitMode:r.splitMode, splitInput:r.splitInput, createdAt:Date.now(), recurringId:r._id };
        if(!S.expensesRaw.some(e=>e._id===id)){
          if(r.variable) await db.doc('expenses/'+id).set({...base, amount:0, split:{}, people:[r.paidBy], status:'needs_amount'});
          else { const split = billSplit(r, r.amount, key); if(!Object.keys(split).length) break;
            await db.doc('expenses/'+id).set({...base, amount:r.amount, split, people:[...new Set([r.paidBy, ...Object.keys(split)])]}); }
        }
        last = key; key = billNextKey(r, key); n++;
      }
      if(last) await db.doc('recurring/'+r._id).update({ lastPosted:last });
    }
  } catch(e){}
  finally{ posting = false; }
}

/* ================= upgrade the old single-house version into a group ================= */
let migrating = false;
async function migrate(){
  if(migrating || !S.legacy || !isOwner || !canWrite || !myUid || !S.got.expenses || !S.got.recurring) return;
  migrating = true; S.upgrading = true; schedule();
  try{
    const cfg = S.legacy, gid = 'g_house', now = Date.now();
    const snap = await db.collection('members').get();
    let mems = snap.docs.map(d => ({...d.data(), id:d.id}));
    if(!mems.length && Array.isArray(cfg.members)) mems = cfg.members.map(m=>({...m, kind:'placeholder'}));
    const remap = {};
    const guestId = old => 'g_'+old.replace(/[^\w-]/g,'');
    await db.doc('groups/'+gid).set({name:cfg.name||'Our house', emoji:'house', createdBy:cfg.createdBy||myUid, createdAt:now, lastAt:now, simplify:cfg.simplify!==false, archived:false});
    for(const m of mems){
      const uid = m.kind==='account' ? m.id : (m.claimedBy || null);
      if(uid){
        remap[m.id] = uid;
        if(!S.people[uid]) await db.doc('people/'+uid).set({nickname:m.nickname||m.name||null, color:m.color||0, joinedAt:m.joinedAt||now});
        await db.doc(`groups/${gid}/members/${uid}`).set({kind:'account', active:m.active!==false, joinedAt:m.joinedAt||now, addedBy:myUid});
      } else {
        const nid = guestId(m.id); remap[m.id] = nid;
        await db.doc(`groups/${gid}/members/${nid}`).set({kind:'guest', name:m.name||'Housemate', color:m.color||0, active:m.active!==false, joinedAt:m.joinedAt||now, addedBy:myUid});
      }
    }
    if(!remap[myUid] && !mems.some(m=>m.id===myUid)) await db.doc(`groups/${gid}/members/${myUid}`).set({kind:'account', active:true, joinedAt:now, addedBy:myUid});
    if(!S.people[myUid] && !Object.values(remap).includes(myUid)) await db.doc('people/'+myUid).set({nickname:null, color:0, joinedAt:now});
    const R = x => remap[x] || x;
    const RO = o => { if(!o) return o; const r = {}; for(const [k,v] of Object.entries(o)) r[R(k)] = (r[R(k)]||0)+v; return r; };
    const RI = i => { if(!i) return i; const o = {...i}; if(o.ids) o.ids = [...new Set(o.ids.map(R))]; if(o.shares) o.shares = RO(o.shares); if(o.exact) o.exact = RO(o.exact); return o; };
    for(const e of S.expensesRaw.filter(e => e.groupId === undefined)){
      const upd = { groupId:gid };
      for(const k of ['paidBy','from','to','addedBy','editedBy','deletedBy']) if(e[k]) upd[k] = R(e[k]);
      if(e.split) upd.split = RO(e.split); if(e.splitInput) upd.splitInput = RI(e.splitInput); upd.splitMode = e.splitMode;
      upd.people = e.kind==='payment' ? [R(e.from), R(e.to)] : [...new Set([R(e.paidBy), ...Object.keys(e.split||{}).map(R)])];
      await db.doc('expenses/'+e._id).update(upd);
    }
    for(const r of S.recurringRaw.filter(r => !r.groupId))
      await db.doc('recurring/'+r._id).update({groupId:gid, paidBy:R(r.paidBy), splitMode:r.splitMode, splitInput:RI(r.splitInput), variable:!!r.variable, mode:null, weights:null, exact:null});
    await db.doc('house/config').update({migratedTo:gid});
    S.legacy = null;
  } catch(e){ toast('Upgrading your house didn’t finish. Reload to try again'); }
  finally{ migrating = false; S.upgrading = false; schedule(); }
}

/* ================= boot ================= */
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(b) go(b.dataset.tab); });
// Offline: a small pill says so, and counts the changes waiting to reach the laptop.
function netPill(){
  const off = window.HouseSplitOffline, pend = off ? off.pending() : 0, offline = off ? off.offline() : false;
  let el = document.getElementById('netpill');
  if(!offline && !pend){ el?.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id = 'netpill'; el.className = 'netpill'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.className = 'netpill' + (!offline && pend ? ' sync' : '');
  el.innerHTML = `<i></i>${offline ? 'Offline' : 'Catching up'}${pend ? ` · ${pend} change${pend===1?'':'s'} waiting` : ' · showing what you had'}`;
}
['hs-offline','hs-online','hs-queue'].forEach(ev => window.addEventListener(ev, netPill));
document.getElementById('addBtn').onclick = () => {
  if(S.page?.type==='group') openExpense({ctx:{type:'group', id:S.page.id}});
  else if(S.page?.type==='friend' && !isGuestOnly(S.page.id)) openExpense({ctx:{type:'friend', id:S.page.id}});
  else openExpense({});
};
let rafPending = false;
const schedule = () => { if(rafPending) return; rafPending = true; requestAnimationFrame(()=>{ rafPending=false;
  if(S.upgrading){ app.innerHTML = `<section class="welcome"><p class="big">One moment</p><div class="empty"><strong>Upgrading your house</strong>Moving it into the new Groups so you can also split with friends.</div></section>`; return; }
  render(); }); };
const memberSubs = {};
function watchGroups(){
  for(const gid of Object.keys(S.groups)) if(!memberSubs[gid]){
    memberSubs[gid] = db.collection(`groups/${gid}/members`).onSnapshot(s => {
      S.gmem[gid] = s.docs.map(d => ({...d.data(), id:d.id})).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
      tick(); }, () => { S.gmem[gid] = S.gmem[gid] || []; tick(); });
  }
}
function tick(){ if(ready()){ migrate(); postDueBills(); } schedule(); }
/* One query returns at most 1000 documents. Most houses stay under that and get one plain query.
   Past 1000, the rest of the history is read in windows of 1000 by when each entry was made. */
function watchAll(path, onDocs, onErr){
  const PAGE = 1000, wins = [];
  const emit = () => { if(!wins.every(w => w.docs)) return; const seen = new Set(), out = [];
    for(const w of wins) for(const d of w.docs) if(!seen.has(d.id)){ seen.add(d.id); out.push(d); }
    onDocs(out); };
  const closeFrom = i => { for(let k = wins.length-1; k >= i; k--){ wins[k].unsub?.(); wins.pop(); } };
  const openTimed = (i, after) => {
    let q = db.collection(path).orderBy('createdAt');
    if(after != null) q = q.where('createdAt', '>', after);
    const w = wins[i] = { after, docs:null };
    w.unsub = q.limit(PAGE).onSnapshot(s => {
      w.docs = s.docs;
      const last = s.docs.length === PAGE ? s.docs[PAGE-1].data().createdAt : null;
      if(last != null && wins[i+1]?.after !== last){ closeFrom(i+1); openTimed(i+1, last); }
      emit();
    }, onErr);
  };
  const first = wins[0] = { docs:null };
  first.unsub = db.collection(path).limit(PAGE).onSnapshot(s => {
    first.docs = s.docs;
    if(s.docs.length === PAGE){ if(wins.length === 1) openTimed(1, null); }
    else closeFrom(1);
    emit();
  }, onErr);
}
async function start(){
  const timer = setTimeout(() => { if(!ready()){ S.failed = true; db = null; render(); } }, 12000);
  try{ await boot(timer); } catch(e){ console.error(e); clearTimeout(timer); S.failed = true; db = null; render(); }
}
async function boot(timer){
  startPhoneApp();
  db = await claude.use('db');
  if(!db){ clearTimeout(timer); render(); return; }
  const [u, smp, dl] = await Promise.all([claude.use('user'), claude.use('sample'), claude.use('downloads')]);
  user = u; sample = smp; downloads = dl;
  if(sample){ try{ canImages = !!(await sample.limits())?.images; }catch(e){ canImages = false; } }
  if(user){ myUid = await user.id(); isOwner = await user.isOwner(); const w = await user.can('data.write'); if(w===false) canWrite = false;
    if(myUid) user.profiles([myUid]).then(ps => { S.prof = {...S.prof, ...ps}; schedule(); }); }
  else canWrite = false;
  const done = () => { if(ready()) clearTimeout(timer); tick(); };
  db.doc('house/config').get().then(s => { const d = s.exists ? s.data() : null; S.legacy = d && !d.migratedTo ? d : null; done(); }).catch(()=>{});
  db.collection('people').onSnapshot(s => { S.people = Object.fromEntries(s.docs.map(d=>[d.id, d.data()])); S.got.people = true; refreshProfiles(); done(); }, () => { S.got.people = true; done(); });
  db.collection('groups').onSnapshot(s => { S.groups = Object.fromEntries(s.docs.map(d=>[d.id, {...d.data(), id:d.id}])); S.got.groups = true; watchGroups(); done(); }, () => { S.got.groups = true; done(); });
  let knownIds = null;
  watchAll('expenses', docs => { const prev = knownIds; knownIds = new Set(docs.map(d=>d.id));
    S.expensesRaw = docs.map(d => normEntry(d.data(), d.id, false)); S.got.expenses = true; done();
    // your payment just got confirmed: the guide cheers
    const pend = new Set(S.expensesRaw.filter(e => e.kind==='payment' && e.from===myUid && e.confirmed===false && !e.deletedAt).map(e=>e._id));
    if(S.pendMine){ const conf = [...S.pendMine].filter(id=>!pend.has(id)).map(id=>S.expensesRaw.find(e=>e._id===id)).filter(e=>e && e.confirmed===true && !e.deletedAt);
      if(conf.length) setTimeout(() => guideSay(`${firstName(conf[0].to)} confirmed your ${money(conf[0].amount)}. Paid and done!`, 'react-up'), 500); }
    S.pendMine = pend;
    if(prev){ const fresh = docs.filter(d => !prev.has(d.id)).map(d => d.data()).filter(e => e && e.addedBy && e.addedBy!==myUid && e.kind==='expense' && !e.deletedAt && !e.recurringId && (e.people||[]).includes(myUid) && Date.now()-(e.createdAt||0) < 120000);
      if(fresh.length){ const e = fresh[0]; setTimeout(() => guideSay(`${firstName(e.addedBy)} just added ${e.title}, ${money(e.amount)}.`, 'glance'), 500); } }
  }, () => { S.got.expenses = true; toast('Some expenses didn’t load. Reload to try again'); done(); });
  db.collection('chores').onSnapshot(s => { S.chores = s.docs.map(d=>({...d.data(), _id:d.id})); schedule(); }, () => {});
  db.collection('recurring').onSnapshot(s => { S.recurringRaw = s.docs.map(d => normBill(d.data(), d.id)); S.got.recurring = true; done(); }, () => { S.got.recurring = true; done(); });
  if(myUid){
    let gotF = false, gotE = false;
    privDoc().collection('friends').onSnapshot(s => { S.privFriends = s.docs.map(d=>({...d.data(), id:d.id})); gotF = true; S.got.priv = gotF && gotE; done(); }, () => { gotF = true; S.got.priv = gotF && gotE; done(); });
    privDoc().collection('favs').onSnapshot(s => { S.favs = s.docs.map(d=>({...d.data(), id:d.id})).sort((a,b)=>(b.at||0)-(a.at||0)); schedule(); }, () => {});
    privDoc().collection('entries').onSnapshot(s => { S.privEntries = s.docs.map(d => normEntry(d.data(), d.id, true)); gotE = true; S.got.priv = gotF && gotE; done(); }, () => { gotE = true; S.got.priv = gotF && gotE; done(); });
  } else S.got.priv = true;
  if(myUid && LAPTOP){ loadInbox(true); useFriendLinkFromUrl(); }
}
start();
})();
