<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split it">
<meta name="application-name" content="Split it">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13111C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Split it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEEF5; --surface:#FFFFFF; --surface2:#F5F4FA; --ink:#1B1830; --muted:#6B6782; --line:#E1DEEC;
  --accent:#4A3AFF; --accent-ink:#FFFFFF; --accent-soft:#E7E4FF; --owed:#0F7F55; --owe:#C9343E;
  --shadow:0 1px 2px rgba(27,24,48,.05),0 6px 18px rgba(27,24,48,.06);
  --tabh:64px;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0E17; --surface:#1A1826; --surface2:#211E30; --ink:#EEEDF7; --muted:#9A96B2; --line:#2B2840;
    --accent:#8F84FF; --accent-ink:#0F0E17; --accent-soft:#29254D; --owed:#4FD39A; --owe:#FF7A80;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0E17; --surface:#1A1826; --surface2:#211E30; --ink:#EEEDF7; --muted:#9A96B2; --line:#2B2840;
  --accent:#8F84FF; --accent-ink:#0F0E17; --accent-soft:#29254D; --owed:#4FD39A; --owe:#FF7A80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none;width:0;height:0}
body,.sheet{scrollbar-width:none;-ms-overflow-style:none}
.pick{width:22px;height:22px;accent-color:var(--accent);flex:none}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",-apple-system,"SF Pro Text",system-ui,sans-serif;
  font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(var(--tabh) + 40px)}
.wrap.notabs{padding-bottom:40px}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
.top h1{flex:1;font-size:1.45rem;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.15}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

/* avatars */
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:.85rem;flex:none;line-height:1}
.av.sm{width:24px;height:24px;font-size:.68rem}
.av.lg{width:48px;height:48px;font-size:1.1rem}
.av.ghost{background:transparent!important;border:2px dashed var(--line);color:var(--muted)!important}
.av.gone{filter:grayscale(1);opacity:.55}

/* hero */
.hero{border-radius:26px;padding:20px 20px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero .lbl{font-size:1rem;font-weight:600;opacity:.88;margin:0;display:flex;align-items:center;gap:8px}
.hero .num{font-size:clamp(2.8rem,15vw,4.8rem);font-weight:800;letter-spacing:-.045em;line-height:1;margin:8px 0 0;white-space:nowrap}
.hero .cents{font-size:.45em;letter-spacing:-.02em;vertical-align:.62em;margin-left:2px}
.hero .meta{margin:12px 0 0;font-size:.93rem;opacity:.88;max-width:34ch}
.hero .ring{position:absolute;right:-70px;bottom:-90px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.13);pointer-events:none}
.hero > *{position:relative}

/* quick add */
.quick{margin:12px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:5px 5px 5px 14px;display:flex;align-items:center;gap:6px}
.quick input{flex:1;border:none;background:none;padding:10px 0;font-size:1rem;min-width:0}
.quick input:focus{outline:none}
.quick:focus-within{border-color:var(--accent)}
.qbtn{border:none;border-radius:13px;height:40px;width:40px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.qbtn.go{background:var(--accent);color:var(--accent-ink)}
.qbtn svg{width:20px;height:20px}
.qhint{font-size:.84rem;color:var(--muted);margin:7px 4px 0}
.thinking{display:inline-flex;gap:3px}
.thinking i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* sections */
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:28px 2px 10px}
.sec-h h2{font-size:1.12rem;font-weight:800;margin:0;letter-spacing:-.01em}
.sec-h .side{color:var(--muted);font-size:.85rem;text-align:right}
.link{background:none;border:none;color:var(--accent);font-weight:600;padding:6px 2px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:20px;padding:22px 18px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.note{font-size:.86rem;color:var(--muted);margin:8px 4px 0}
.note.bad{color:var(--owe)}
.pos{color:var(--owed)} .neg{color:var(--owe)} .mut{color:var(--muted)}

/* receipt photos */
.photorow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rthumb{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid var(--edge)}
.rphoto{display:flex;gap:12px;align-items:center;margin:12px 0 0;color:var(--muted);font-size:.86rem;text-decoration:none}
.rphoto img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:2px solid var(--edge);box-shadow:3px 3px 0 var(--pop)}
/* tappable charts */
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit.on{fill:var(--hl);opacity:.28}
.chart .hit:focus-visible{outline:none;stroke:var(--accent);stroke-width:2}
.charthint{margin:6px 0 0;font-size:.8rem;color:var(--muted);text-align:center}
.monthlist .row{animation:rowin .3s both}
.monthlist .row:nth-child(2){animation-delay:.03s}.monthlist .row:nth-child(3){animation-delay:.06s}.monthlist .row:nth-child(4){animation-delay:.09s}.monthlist .row:nth-child(n+5){animation-delay:.12s}
@keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.chart svg rect,.chart svg text,.monthlist .row{animation:none!important}}
/* PAID stamp */
.party-card .sfx.stamp{bottom:80px;color:#E0243C;-webkit-text-stroke:0;text-shadow:none;background:#fff;border:5px double #E0243C;border-radius:10px;padding:2px 14px 0;letter-spacing:.06em;
  box-shadow:3px 3px 0 #14112A;animation:stamp .5s .2s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{0%{transform:scale(2.6) rotate(-20deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.hero .num{font-variant-numeric:tabular-nums}
/* install card */
.installcard{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;margin-top:14px}
.installcard .body{flex:1;min-width:0}.installcard .t{font-weight:800}.installcard .m{color:var(--muted);font-size:.86rem}
/* favourites */
.favs{margin-top:14px}.favh{display:flex;justify-content:space-between;align-items:center;margin:0 2px 6px}.favh b{font-weight:800}
.favchip{gap:6px}.favchip .ico{width:1.3em;height:1.3em}.favchip small{color:var(--muted);font-weight:700}
.sheet .foot .favbtn{flex:0 0 auto;font-size:1.25rem;padding:10px 14px}
.lasthint{margin-top:6px}.lasthint .link{padding:0 2px}
/* whose turn */
.turnbar{gap:10px}.turnbar b{font-weight:800}
/* chores */
.row.chore{gap:8px;padding-right:12px}.row.chore.mine{background:var(--accent-soft)}
.choreopen{flex:1;min-width:0;display:flex;gap:12px;align-items:center;background:none;border:none;padding:0;text-align:left}
.choreopen .body{flex:1;min-width:0}
.pill.late{background:var(--owe);color:#fff}
/* settle */
.settle{padding:14px 16px;border-top:1px solid var(--line)}
.settle:first-child{border-top:none}
.settle.mine{background:var(--accent-soft)}
.settle .line{display:flex;align-items:center;gap:8px;min-width:0}
.settle .arrow{color:var(--muted);flex:none}
.settle .who{flex:1;min-width:0;font-size:.93rem}
.settle .amt{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;flex:none}
.settle .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* buttons */
.btn{border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:600;background:var(--surface2);white-space:nowrap;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--owe);border-color:var(--owe)}
.btn.sm{padding:8px 13px;font-size:.88rem}
.btn.block{display:block;width:100%;padding:14px}
.btn:disabled{opacity:.45;cursor:default}

/* rows */
.row{width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;min-height:64px}
.row:first-child{border-top:none}
button.row:active{background:var(--surface2)}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .m{color:var(--muted);font-size:.84rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;line-height:1.25;flex:none;max-width:45%}
.row .r b{font-weight:600;white-space:nowrap}
.row .r small{display:block;font-size:.8rem;margin-top:2px;white-space:nowrap}
.row .chev{color:var(--muted);flex:none}
.ic{width:42px;height:42px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-size:1.15rem;flex:none}
.pill{font-size:.78rem;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.soon{background:var(--accent-soft);color:var(--accent)}
.todo{padding:14px 16px;border-top:1px solid var(--line)}
.todo:first-child{border-top:none}
.todo .line{display:flex;gap:12px;align-items:center}
.todo .acts{display:flex;gap:8px;margin:10px 0 0 54px}

.todo .body{flex:1;min-width:0}.todo .t{font-weight:600;line-height:1.25}.todo .m{color:var(--muted);font-size:.84rem;margin-top:2px}
.hero .split2{display:flex;gap:24px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25)}
.hero .split2 small{display:block;font-size:.8rem;opacity:.85}.hero .split2 b{font-size:1.1rem}
.ctxbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:4px 0 0}
.ctxbar b{flex:1;min-width:0}
.top .icon-btn .av{width:26px;height:26px}
.cursel{border:none;background:var(--surface2);border-radius:10px;font-weight:700;padding:8px 6px;margin-right:6px;font-size:1rem}
.raterow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.92rem;flex-wrap:wrap}
.raterow input{width:90px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:right}
.seg.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.chip.sm{padding:5px 10px 5px 6px;font-size:.84rem;gap:5px}
.items{margin-top:10px}.items .item{padding:10px 12px;border-top:1px solid var(--line)}.items .item:first-child{border-top:none}
.irow{display:flex;gap:8px;align-items:center}.irow .in{padding:9px 11px}.irow .price{width:96px;flex:none;text-align:right}
.items .who{margin-top:8px;gap:6px}
.taxtip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.taxtip label{font-size:.84rem;font-weight:600;color:var(--muted)}.taxtip .in{margin-top:4px}
button.row.card{border:1px solid var(--line);border-radius:18px}
/* ===== icons ===== */
.ico{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.28em;flex:none;overflow:visible}
.ic .ico{width:28px;height:28px}
.ico.tiny{width:1.05em;height:1.05em;vertical-align:-.18em}
.ico.ttl{width:1.15em;height:1.15em;vertical-align:-.2em}
.ico.x{width:16px;height:16px;vertical-align:middle}
.close{display:grid;place-items:center;color:var(--ink)}
.chip .ico{width:1.5em;height:1.5em;margin:-2px 0}
.iconchip{padding:6px 10px}.iconchip .ico{width:26px;height:26px}
.cmt{display:inline-flex;align-items:center;gap:2px;font-size:.85rem}
.ai-tag .ico{width:1.1em;height:1.1em}
.party{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(12,10,24,.45);animation:fadein .15s ease-out}
.party.out{opacity:0;transition:opacity .35s}
.party-card{position:relative;width:280px;height:280px;display:grid;place-items:center;animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
.party-card .coinhop{position:absolute;left:8px;bottom:40px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF3A6,#FFD23F 55%,#E0A800);border:3px solid #14112A;z-index:3;
  font:900 18px/28px system-ui;color:#14112A;text-align:center;animation:coinhop .7s cubic-bezier(.3,.7,.4,1) both}
@keyframes coinhop{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:0}15%{opacity:1}55%{transform:translate(110px,-150px) rotate(300deg) scale(1.1)}100%{transform:translate(230px,0) rotate(720deg) scale(.4);opacity:0}}
.party-card .burst{position:absolute;inset:0;width:100%;height:100%;animation:spin 6s linear infinite}
.party-card .portrait{width:130px;height:130px;position:relative;margin-top:-26px}
.party-card .sfx{position:absolute;bottom:52px;font-size:2.4rem;font-weight:800;letter-spacing:.02em;color:#FF3B5C;-webkit-text-stroke:2px #14112A;text-shadow:3px 3px 0 #14112A;transform:rotate(-6deg)}
.party-card .msg{position:absolute;bottom:20px;background:#14112A;color:#fff;font-weight:700;padding:5px 12px;border-radius:999px;font-size:.92rem}
@keyframes spin{to{transform:rotate(360deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:58%;width:9px;height:14px;border-radius:2px;animation:burstc 1.4s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes burstc{0%{transform:translate(0,0) rotate(0)}70%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 420px)) rotate(var(--r));opacity:0}}
@keyframes popin{from{transform:scale(.5) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* activity */
.tools{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:1rem;margin-bottom:10px}
.month{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;margin:20px 4px 8px}

/* insights */
.chart{padding:18px 16px 12px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;gap:16px;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat .v{font-size:clamp(1.15rem,5.4vw,1.45rem);font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k{color:var(--muted);font-size:.84rem;margin-top:2px}
.bar{height:7px;border-radius:4px;background:var(--surface2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

/* chips & seg */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.qrbox{display:grid;place-items:center;margin:12px auto 0;width:min(220px,70vw)}.qrbox svg{width:100%;height:auto;border-radius:12px;border:2.5px solid var(--edge,var(--line))}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;display:inline-flex;gap:7px;align-items:center;font-size:.92rem;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.5}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{border:none;background:none;border-radius:11px;padding:9px 4px;font-weight:600;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* tab bar with centre add button */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--tabh);align-items:center}
nav.tabs .tab{position:relative}
nav.tabs .tab .tdot{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--neg,#d33);color:#fff;font-size:.62rem;font-weight:800;line-height:16px;text-align:center;border:1.5px solid var(--edge,#111)}
@media (min-width:900px){ nav.tabs .tab .tdot{position:static;margin-left:auto} }
nav.tabs .tab{background:none;border:none;height:100%;display:grid;justify-items:center;align-content:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted)}
nav.tabs .tab svg{width:23px;height:23px}
nav.tabs .tab[aria-current="page"]{color:var(--accent)}
nav.tabs .add{justify-self:center;width:52px;height:52px;border-radius:18px;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
nav.tabs .add svg{width:26px;height:26px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(12,10,24,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;overscroll-behavior:contain;border-radius:26px 26px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.thinking i{animation:none}}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.sheet h3{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;font-size:1rem;flex:none}
.sheet .foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);margin:18px -16px calc(-20px - env(safe-area-inset-bottom,0px));
  padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet .foot .btn{flex:1;padding:14px;font-size:1rem}
label.f{display:block;font-size:.86rem;font-weight:600;color:var(--muted);margin:16px 2px 7px}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1rem;min-width:0}
textarea.in{resize:vertical;min-height:60px}
.amount-wrap{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.amount-wrap span{font-size:1.9rem;font-weight:800;color:var(--muted)}
.amount-wrap input{border:none;background:none;font-size:2.3rem;font-weight:800;letter-spacing:-.03em;width:100%;min-width:0;padding:4px 6px}
.amount-wrap input:focus{outline:none}
.amount-wrap:focus-within,.in:focus{border-color:var(--accent);outline:none}
.payrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px}
.split{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px}
.srow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);min-height:52px}
.srow:first-child{border-top:none}
.srow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow input[type=number]{width:84px;flex:none;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:right}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.srow .share{width:76px;flex:none;text-align:right;color:var(--muted);font-size:.9rem;white-space:nowrap}
.toggle{display:flex;align-items:flex-start;gap:12px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.toggle small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:.92rem;margin:0 0 14px}
.ai-tag{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.84rem;border-radius:999px;padding:5px 10px;margin-bottom:4px}
.detail-amt{font-size:2.8rem;font-weight:800;letter-spacing:-.04em;margin:2px 0;line-height:1.05}
.pair{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.comment{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.comment:first-child{border-top:none}
.comment .body{flex:1;min-width:0}
.comment .who{font-size:.82rem;color:var(--muted)}
.comment p{margin:2px 0 0;overflow-wrap:anywhere}
.cbox{display:flex;gap:8px;margin-top:10px}

/* toast sits just above the tab bar */
.toast{position:fixed;left:12px;right:12px;margin:0 auto;max-width:536px;bottom:calc(var(--tabh) + 12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  min-height:48px;padding:8px 8px 8px 16px;border-radius:16px;font-weight:600;z-index:60;font-size:.95rem;display:flex;gap:10px;align-items:center;justify-content:space-between;
  box-shadow:0 8px 28px rgba(0,0,0,.25);animation:drop .2s ease-out}
.toast span{min-width:0}
.toast button{background:var(--bg);color:var(--ink);border:none;border-radius:10px;font-weight:700;padding:6px 10px;flex:none}
.toast.plain{padding-right:16px}
.toast.top{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto}
@keyframes drop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* join & setup */
.welcome{padding-top:20px}
.welcome .big{font-size:clamp(2.3rem,11vw,3.3rem);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin:8px 0 10px}
.stackrow{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.colors button:disabled{opacity:.25}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;flex:none;font-size:.85rem}

/* =====================================================================
   MANGA THEME: ink outlines, hard shadows, halftone paper, panel layouts
   ===================================================================== */
:root{--bg:#F5F1E8;--surface:#FFFFFF;--surface2:#F1ECE1;--ink:#14112A;--edge:#14112A;--pop:#14112A;--on-bg:#14112A;--on-ink:#F5F1E8;--on-pop:#FFD23F;--muted:#5D5870;--line:rgba(20,17,42,.14);
  --accent:#2D5BFF;--accent-ink:#FFFFFF;--accent-soft:#FFF1B8;--hl:#FFD23F;--owed:#0B7A45;--owe:#E0243C;--dot:rgba(20,17,42,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121019;--surface:#1D1A2A;--surface2:#262236;--ink:#F1EEFF;--edge:#9C94C8;--pop:#5B5391;--on-bg:#F1EEFF;--on-ink:#14112A;--on-pop:#FFD23F;--muted:#ADA7C6;--line:rgba(241,238,255,.10);
  --accent:#8EA6FF;--accent-ink:#121019;--accent-soft:#3A3120;--hl:#FFD23F;--owed:#4FD39A;--owe:#FF6B7D;--dot:rgba(241,238,255,.10)}}
:root[data-theme="dark"]{--bg:#121019;--surface:#1D1A2A;--surface2:#262236;--ink:#F1EEFF;--edge:#9C94C8;--pop:#5B5391;--on-bg:#F1EEFF;--on-ink:#14112A;--on-pop:#FFD23F;--muted:#ADA7C6;--line:rgba(241,238,255,.10);
  --accent:#8EA6FF;--accent-ink:#121019;--accent-soft:#3A3120;--hl:#FFD23F;--owed:#4FD39A;--owe:#FF6B7D;--dot:rgba(241,238,255,.10)}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:12px 12px}
.top h1,.welcome .big,.hero .num,.detail-amt,.sec-h h2,.sheet h3,.stat .v{font-family:"Dela Gothic One","Bricolage Grotesque",system-ui,sans-serif;font-weight:400;letter-spacing:0}
.top h1{font-size:1.45rem}
.card,.empty,.stat,.quick,.in,.search,.amount-wrap,.split,.toggle,.ctxbar,button.row.card{border:2.5px solid var(--edge)!important;box-shadow:4px 4px 0 var(--pop);border-radius:14px}
.in,.search,.amount-wrap,.split,.ctxbar{box-shadow:3px 3px 0 var(--pop)}
.empty{border-style:dashed!important;box-shadow:none}
.card .row,.settle,.todo,.srow,.items .item,.comment{border-top-color:var(--line)}
.btn{border:2.5px solid var(--edge);box-shadow:3px 3px 0 var(--pop);font-weight:800;border-radius:12px;background:var(--surface);color:var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pop)}
.btn.primary{background:var(--hl);color:#14112A;border-color:var(--edge)}
.btn.danger{background:var(--surface);color:var(--owe);border-color:var(--owe);box-shadow:3px 3px 0 var(--owe)}
.chip{border:2px solid var(--edge);font-weight:600;border-radius:10px}
.chip[aria-pressed="true"]{background:var(--on-bg);color:var(--on-ink);border-color:var(--on-bg);box-shadow:2px 2px 0 var(--on-pop)}
.seg{border:2.5px solid var(--edge);border-radius:12px;background:var(--surface2);box-shadow:3px 3px 0 var(--pop)}
.seg button[aria-pressed="true"]{background:var(--hl);color:#14112A;box-shadow:none;border-radius:8px}
.link{color:var(--ink);font-weight:800;text-decoration:underline;text-decoration-thickness:2.5px;text-decoration-color:var(--hl);text-underline-offset:4px}
.sec-h{margin-top:30px}
.sec-h h2{display:inline-block;background:var(--ink);color:var(--bg);padding:5px 14px 4px;font-size:.98rem;transform:skewX(-10deg);box-shadow:3px 3px 0 var(--hl)}
.sec-h .side{font-weight:700}
.icon-btn{border:2.5px solid var(--edge);box-shadow:2px 2px 0 var(--pop)}
.ic{border:2px solid var(--edge);background:var(--accent-soft);border-radius:12px}
.pill{border:2px solid var(--edge);background:var(--surface);color:var(--ink);font-weight:800}
.pill.soon{background:var(--hl);color:#14112A}
.av{border:2px solid var(--edge)}
.av.ghost{border:2px dashed var(--edge)}
/* hero = a manga panel with speed lines; the figure stands on top of it */
.hero{border:3px solid var(--edge);border-radius:16px;box-shadow:6px 6px 0 var(--pop);overflow:hidden;
  background-image:repeating-conic-gradient(from 0deg at 85% 120%,rgba(255,255,255,.16) 0deg 2.5deg,transparent 2.5deg 8deg)!important}
.hero .ring{display:none}
.hero .num{font-size:clamp(2.6rem,13vw,4.2rem);text-shadow:3px 3px 0 rgba(20,17,42,.35);margin-top:6px}
.hero .cents{font-size:.5em;vertical-align:.7em}
.hero .lbl{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.82rem}
.hero .split2{border-top:2px dashed rgba(255,255,255,.45)}
.fig{display:block}
.party-card .sfx{bottom:40px;font-family:"Dela Gothic One",sans-serif}
/* tab bar, sheets, toasts */
nav.tabs{border-top:none!important;background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;pointer-events:none;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))!important}
nav.tabs .in{pointer-events:auto;background:var(--surface)!important;border:2.5px solid var(--edge)!important;border-radius:18px!important;box-shadow:4px 4px 0 var(--pop)!important;padding:0 6px!important;width:auto!important}
nav.tabs .tab[aria-current="page"]{color:var(--ink)}
nav.tabs .tab[aria-current="page"] svg{background:var(--hl);border-radius:10px;padding:2px;box-shadow:2px 2px 0 var(--pop);stroke:#14112A}
nav.tabs .add{background:var(--hl);color:#14112A;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--pop);border-radius:16px}
.sheet{border:3px solid var(--edge);border-bottom:none;border-radius:20px 20px 0 0}
.sheet:focus{outline:none}
.grab{background:var(--edge);opacity:.5}
.close{border:2.5px solid var(--edge);box-shadow:2px 2px 0 var(--pop)}
.sheet .foot{border-top:2.5px solid var(--edge)}
.toast{background:#fff;color:#14112A;border:2.5px solid #14112A;box-shadow:4px 4px 0 #14112A;border-radius:16px}
.toast button{background:var(--hl);color:#14112A;border:2px solid #14112A}
.ai-tag{background:var(--hl);color:#14112A;border:2px solid var(--edge)}
.banner{border:2px solid var(--edge);background:var(--accent-soft)}
.colors button{border:3px solid var(--edge)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--hl),3px 3px 0 3px var(--pop)}
.qbtn{border:2px solid var(--edge)}.qbtn.go{background:var(--hl);color:#14112A}
.settle.mine{background:var(--accent-soft)}
.chart rect[fill="var(--accent)"]{stroke:var(--edge);stroke-width:2}
.bar{border:1.5px solid var(--edge);height:9px}


/* ===== dashboard ===== */
.hero.v2{background:#1A1626!important;color:#F7F3EA!important;padding:22px 20px;min-height:178px;display:flex;align-items:flex-end;overflow:visible;border-radius:18px;margin-top:38px;
  background-image:repeating-conic-gradient(from 0deg at 100% 100%,rgba(255,255,255,.05) 0deg 2deg,transparent 2deg 7deg)!important;box-shadow:5px 5px 0 var(--hl)}
.hero.v2.sm{min-height:150px;margin-top:34px}
.hero.v2 .htext{position:relative;z-index:2;width:100%}
.hero.v2.has-art .htext{width:calc(100% - 118px)}
.hero.v2 .lbl{color:#C9C3DA;font-size:.78rem}
.hero.v2 .num{color:#fff;font-size:min(3.6rem, calc((100vw - 190px) / (var(--n) * .66)));text-shadow:none;white-space:nowrap;margin:6px 0 2px}
.hero.v2.sm .num{font-size:min(3rem, calc((100vw - 190px) / (var(--n) * .66)))}
.hero.v2.up .num{color:#FFD23F}.hero.v2.down .num{color:#FF8A9A}
.hero.v2 .hline{margin:6px 0 0;color:#C9C3DA;font-size:.92rem}
.hero.v2 .hart{position:absolute;right:4px;bottom:0;width:132px;height:auto;z-index:1;pointer-events:none}
.hero.v2.sm .hart{width:112px}
.hero.v2 .hart .art{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.hero.v2 .hart .art{clip-path:inset(-60px -20px 0 -20px)}
.hero.v2 .hart{height:calc(100% + 54px);display:flex;align-items:flex-end;overflow:hidden;border-radius:0 0 18px 0}
.hero.v2 .hart .art{width:100%;transform:translateY(34%)}
.hero.v2.sm .hart{height:calc(100% + 46px)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--pop);padding:10px 12px;text-align:left;display:grid;gap:2px;min-width:0}
.tile small{color:var(--muted);font-size:.76rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(.88rem,4vw,1.15rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile b .cents{font-size:.66em;opacity:.8}.tile b.long{font-size:clamp(.74rem,3.4vw,.98rem)}
button.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pop)}
.gcards{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}.gcards::-webkit-scrollbar{display:none}
.gcard{flex:none;width:138px;background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--pop);padding:12px;text-align:left;display:grid;gap:6px}
.gcard b{font-weight:800;font-size:.95rem}.gcard small{font-size:.82rem;font-weight:700}
.gcard:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pop)}
.guides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.guidebtn{background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--pop);padding:8px 6px 10px;display:grid;justify-items:center;gap:6px;font-weight:800}
.guidebtn[aria-pressed="true"]{background:var(--hl);color:#14112A}
.gart{width:100%;aspect-ratio:150/190;border-radius:10px;overflow:hidden;background:#1A1626;display:grid;place-items:center}
.gart .art{width:100%;height:100%;display:block}
.guidebtn.none .gart span{color:#C9C3DA;font-weight:700}
.lineup{display:flex;gap:6px;align-items:flex-end;justify-content:flex-start}.lineup .fig{width:110px}.lineup .art{width:100%;height:auto;display:block}
.empty.with-lulu .fig{width:64px;flex:none;border-radius:12px;overflow:hidden;background:#1A1626;border:2px solid var(--edge)}
.empty.with-lulu .fig .art{width:100%;height:auto;display:block}
.party-card .fig{width:140px;border-radius:50%;overflow:hidden;background:#1A1626;border:3px solid #14112A;aspect-ratio:1;display:grid;place-items:end center}
.party-card .fig .art{width:118%;height:auto;margin-bottom:-8%}
.guides{grid-template-columns:repeat(4,minmax(0,1fr))}
.gart{background:radial-gradient(circle at 50% 35%,#3A3355,#1A1626 70%)}
.artimg{display:block;width:100%;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-origin:50% 90%;animation:imgBreathe 4.2s ease-in-out infinite}
.artimg.m-happy{animation:imgBob 2.6s ease-in-out infinite}
.artimg.m-worried{animation:imgFret 3.2s ease-in-out infinite}
@keyframes imgBreathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1px) scale(1.012)}}
@keyframes imgBob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg) translateY(-3px)}}
@keyframes imgFret{0%,100%{transform:rotate(0)}20%{transform:rotate(-2.5deg)}40%{transform:rotate(1.8deg)}60%{transform:rotate(0)}}
.hero.v2 .hart.has-img .artimg{width:100%;height:100%;object-fit:contain;object-position:50% 100%;margin-bottom:2px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.28))}
.gart .artimg{height:92%;width:auto;max-width:92%;object-fit:contain}
.party-card .fig.has-img{border-radius:0;background:none;border:0;overflow:visible;aspect-ratio:auto;width:150px;height:220px;place-items:end center}
.party-card .fig.has-img .artimg{width:auto;height:100%;max-width:100%}
.empty.with-lulu .fig.has-img{height:84px;display:grid;place-items:end center}
.empty.with-lulu .fig.has-img .artimg{height:100%;width:auto;max-width:100%}
.party-card .fig .artimg{width:100%;margin-bottom:0}
.empty.with-lulu .fig .artimg,.lineup .artimg{width:100%;height:auto}
@media (prefers-reduced-motion:reduce){.artimg{animation:none!important}}
/* stacked poses: all four moods are loaded once and crossfade, no flicker on a change */
.hero.v2 .hart.has-img .artimg{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity .5s ease;animation:none}
.hero.v2 .hart.has-img .artimg.on{opacity:1}
.hero.v2 .hart.has-img .artimg.on.m-happy{animation:imgBob 2.6s ease-in-out infinite}
.hero.v2 .hart.has-img .artimg.on.m-calm{animation:imgBreathe 4.2s ease-in-out infinite}
.hero.v2 .hart.has-img .artimg.on.m-worried{animation:imgFret 3.2s ease-in-out infinite}
.hero.v2 .hart.has-img .artimg.on.m-celebrate{animation:imgCheer 1.1s ease-in-out infinite}
@keyframes imgCheer{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-10px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
.hero.v2 .hart{transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
.hero.v2 .hart.lean{transform:translateX(-10px) rotate(-5deg)}
.hero.v2 .hart.glance{animation:guideglance .9s ease-in-out}
@keyframes guideglance{0%,100%{transform:none}30%{transform:translateX(-8px) rotate(-4deg)}70%{transform:translateX(-8px) rotate(-4deg)}}
/* dark mode: the panel lifts off the page a little more (light mode stays as it was) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero.v2{background-color:#241D3F!important;border-color:var(--edge);background-image:repeating-conic-gradient(from 0deg at 100% 100%,rgba(255,255,255,.075) 0deg 2deg,transparent 2deg 7deg)!important}}
:root[data-theme="dark"] .hero.v2{background-color:#241D3F!important;border-color:var(--edge);background-image:repeating-conic-gradient(from 0deg at 100% 100%,rgba(255,255,255,.075) 0deg 2deg,transparent 2deg 7deg)!important}
/* tiles never cut a number off: big amounts drop the cents and shrink a step instead */
.tile b{overflow:visible;text-overflow:clip;font-size:clamp(.84rem,3.7vw,1.15rem);letter-spacing:-.01em}
.tile b.long{font-size:clamp(.72rem,3vw,1rem)}
/* offline pill */
.netpill{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));z-index:40;background:#14112A;color:#fff;border:2px solid #FFD23F;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.netpill i{width:8px;height:8px;border-radius:50%;background:#FF8A9A}.netpill.sync i{background:#FFD23F;animation:blink 1s infinite}
/* month headers in lists carry the month's total */
.month .tot{font-weight:700;color:var(--ink)}.month .tot small{color:var(--muted);font-weight:600;margin-left:6px}
/* unread comments */
.cmt.new{color:var(--accent);font-weight:800}.cmt.new::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:3px}
/* wanted poster */
.poster{margin-top:14px;background:#F3E6C4;color:#2B1D0E;border:3px solid #2B1D0E;border-radius:6px;box-shadow:5px 5px 0 var(--pop);padding:12px 14px 12px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;position:relative;overflow:hidden;text-align:left;width:100%;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.poster::before{content:"";position:absolute;inset:5px;border:1.5px dashed rgba(43,29,14,.45);border-radius:3px;pointer-events:none}
.poster .pimg{height:112px;display:grid;place-items:end center;background:#E8D7AC;border:2px solid #2B1D0E;border-radius:4px;overflow:hidden}
.poster .pimg img{height:108%;width:auto;max-width:none;filter:sepia(.35) contrast(1.05);margin-bottom:-6px}
.poster .pimg .av{margin-bottom:28px}
.poster .wanted{font-family:"Dela Gothic One",sans-serif;font-size:1.5rem;letter-spacing:.14em;line-height:1;margin:0}
.poster .pname{font-weight:800;font-size:1.05rem;margin:4px 0 0}
.poster .bounty{font-family:"Dela Gothic One",sans-serif;font-size:1.3rem;margin:4px 0 0;color:#8B1E1E}
.poster .psub{font-size:.78rem;opacity:.8;margin:2px 0 0;font-weight:600}
.poster .stampd{position:absolute;right:10px;top:10px;font-family:"Dela Gothic One",sans-serif;font-size:.7rem;color:#8B1E1E;border:2.5px solid #8B1E1E;border-radius:4px;padding:1px 5px;transform:rotate(12deg);letter-spacing:.08em;opacity:.85}
/* streak and celebration shake */
.party-card.shake{animation:popin .45s cubic-bezier(.2,1.6,.4,1), shake .5s .5s ease-in-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* loader shows your guide */
.loader .loadart{height:120px;width:auto;animation:imgBob 2.2s ease-in-out infinite}
/* budgets */
.budget{display:grid;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line)}.budget:last-child{border-bottom:0}
.budget .bl{display:flex;justify-content:space-between;font-size:.9rem}.budget .bl b{font-weight:800}
.budget .bar{height:10px;border:2px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--surface2)}
.budget .bar i{display:block;height:100%;background:var(--owed);border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.25,1)}
.budget.warn .bar i{background:#E0A400}.budget.over .bar i{background:var(--owe)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.cal .dow{font-size:.7rem;color:var(--muted);text-align:center;font-weight:700}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.85rem;font-weight:600;position:relative;border:2px solid transparent}
.cal .d.has{background:var(--accent-soft);border-color:var(--edge);cursor:pointer}
.cal .d.today{outline:2.5px solid var(--accent);outline-offset:-2px}
.cal .d .n{position:absolute;right:3px;bottom:2px;font-size:.6rem;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:14px;height:14px;display:grid;place-items:center;padding:0 3px}
.cal .d.pad{opacity:0}
/* admin */
.health{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
.health .stat{padding:10px 12px}.health .stat .v{font-size:1.05rem}.health .stat .k{font-size:.74rem}
.sel{border:2px solid var(--edge);border-radius:12px;padding:6px 10px;background:var(--surface);font-weight:600;font-size:.86rem;max-width:11em}
.tools.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mic.on{background:var(--owe);color:#fff;animation:blink 1s infinite}
.many .row .pick{margin-right:8px}
.ocrbar{height:8px;border:2px solid var(--edge);border-radius:999px;overflow:hidden;margin:10px 0 0;background:var(--surface2)}.ocrbar i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* =====================================================================
   CHARTS v2 + MOTION
   ===================================================================== */
:root{--cv1:#2D5BFF;--cv2:#93AAFF;--s0:#A19DB3;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cv1:#6A8AF2;--cv2:#3F5BBD;--s0:#6E6A85;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}}
:root[data-theme="dark"]{--cv1:#6A8AF2;--cv2:#3F5BBD;--s0:#6E6A85;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}

.chart{padding:14px 14px 12px}
.chart .charttop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 0 10px;min-height:2.4em}
.chart .readout{font-size:.86rem;color:var(--ink);line-height:1.35;flex:1;min-width:0}
.seg.mini{display:flex;padding:2px;border-width:2px;box-shadow:2px 2px 0 var(--pop);flex:none}
.seg.mini button{padding:4px 9px;font-size:.78rem}
.chart svg .base{stroke:var(--edge);stroke-width:1.5;opacity:.5}
.chart svg .stub{fill:var(--line)}
.chart svg .bar path,.chart svg .bar rect{stroke:var(--edge);stroke-width:1.5;stroke-linejoin:round}
.chart svg .bar{transform-box:fill-box;transform-origin:50% 100%;animation:barup .7s var(--d,0ms) cubic-bezier(.2,.9,.25,1.12) both}
.chart svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart svg text.val{font-weight:700;animation:appear .4s .45s both;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.chart svg text.val.cur{fill:var(--ink)}
.chart svg .avg{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.55;animation:appear .5s .6s both}
.chart svg .hit.on{fill:var(--hl);opacity:.3}
.legend{flex-wrap:wrap;gap:6px 14px}
.legend i.dash{width:16px;height:0;border-radius:0;border-top:2px dashed var(--ink);opacity:.6;vertical-align:3px;background:none}
.chart svg .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart svg .ln.now{stroke:var(--cv1);stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .1s cubic-bezier(.4,0,.2,1) forwards}
.chart svg .ln.prev{stroke:var(--muted);stroke-dasharray:3 4;opacity:.7}
.chart svg .ln.proj{stroke:var(--cv1);stroke-dasharray:2 5;opacity:.6;animation:appear .4s 1s both}
.chart svg .ln.bal{stroke:var(--ink);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}
.chart svg .dot{fill:var(--cv1);stroke:var(--surface);stroke-width:2;animation:popin .35s 1s both;transform-box:fill-box;transform-origin:center}
.chart svg .dot.up{fill:var(--owed)} .chart svg .dot.down{fill:var(--owe)}
.chart svg .area{opacity:.16;animation:appear .6s .7s both}.chart svg .area.up{fill:var(--owed)}.chart svg .area.down{fill:var(--owe)}
.chart svg .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.chart svg .xh{stroke:var(--ink);stroke-width:1;opacity:.5}
.chart svg .track{fill:transparent;cursor:crosshair;touch-action:pan-y}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes appear{from{opacity:0}}
.catstrip{display:flex;gap:2px;height:16px;border:2px solid var(--edge);border-radius:8px;overflow:hidden;margin:0 0 10px;background:var(--surface);box-shadow:2px 2px 0 var(--pop)}
.catstrip i{display:block;min-width:3px;transform-origin:left;animation:growx .6s var(--d,0ms) cubic-bezier(.2,.9,.25,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
.row .t i.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0;border:1px solid var(--edge)}
.bar i{transform-origin:left;animation:growx .7s .1s cubic-bezier(.2,.9,.25,1) both}
.tile .spark{width:64px;height:18px;display:block;margin-top:2px;overflow:visible}
.tile .spark path{fill:none;stroke:var(--cv1);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .2s ease-out forwards}
.tile .spark circle{fill:var(--cv1);animation:popin .3s 1s both;transform-box:fill-box;transform-origin:center}
.note.waiting{display:flex;gap:6px;align-items:flex-start}
.likehint{display:flex;gap:6px;align-items:center;color:var(--accent);font-weight:600}

/* page changes: forward slides in from the right, back from the left, tabs rise */
#app.nav-fwd>*{animation:navfwd .32s cubic-bezier(.2,.8,.2,1) both}
#app.nav-back>*{animation:navback .32s cubic-bezier(.2,.8,.2,1) both}
#app.nav-tab>*{animation:navtab .3s cubic-bezier(.2,.8,.2,1) both}
#app.nav-fwd>*:nth-child(2),#app.nav-back>*:nth-child(2),#app.nav-tab>*:nth-child(2){animation-delay:.04s}
#app.nav-fwd>*:nth-child(n+3),#app.nav-back>*:nth-child(n+3),#app.nav-tab>*:nth-child(n+3){animation-delay:.08s}
@keyframes navfwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes navback{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes navtab{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* list rows, cards and tiles arrive in a quick cascade */
#app.nav-in .card>.row,#app.nav-in .card>.todo,#app.nav-in .card>.settle,#app.nav-in .tile,#app.nav-in .gcard{animation:rowin .34s cubic-bezier(.2,.8,.2,1) both}
#app.nav-in .card>:nth-child(2),#app.nav-in .tile:nth-child(2),#app.nav-in .gcard:nth-child(2){animation-delay:.05s}
#app.nav-in .card>:nth-child(3),#app.nav-in .tile:nth-child(3),#app.nav-in .gcard:nth-child(3){animation-delay:.1s}
#app.nav-in .card>:nth-child(4),#app.nav-in .gcard:nth-child(4){animation-delay:.15s}
#app.nav-in .card>:nth-child(n+5),#app.nav-in .gcard:nth-child(n+5){animation-delay:.2s}
.sheet .card>.row,.sheet .card>.srow{animation:rowin .3s both}
.sheet .card>:nth-child(2){animation-delay:.04s}.sheet .card>:nth-child(3){animation-delay:.08s}.sheet .card>:nth-child(n+4){animation-delay:.12s}
/* sheets close downward instead of vanishing */
.scrim{animation:fadein .2s both}
.scrim.out{animation:fadeout .2s both;pointer-events:none}
.scrim.out .sheet{animation:down .2s cubic-bezier(.4,0,1,1) both}
@keyframes fadeout{to{opacity:0}}
@keyframes down{to{transform:translateY(80px);opacity:0}}
@media (min-width:760px){.sheet{animation:sheetpop .26s cubic-bezier(.2,1.2,.3,1) both}.scrim.out .sheet{animation:sheetaway .18s ease-in both}}
@keyframes sheetpop{from{transform:translateY(18px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetaway{to{transform:translateY(10px) scale(.98);opacity:0}}
/* taps feel physical */
button.row,.gcard,.chip,.tile,nav.tabs .tab{transition:transform .12s cubic-bezier(.2,.8,.2,1)}
button.row:active,.choreopen:active{transform:scale(.985)}
.gcard:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pop)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{animation:chippop .22s cubic-bezier(.2,1.6,.4,1)}
@keyframes chippop{0%{transform:scale(.9)}100%{transform:none}}
nav.tabs .tab[aria-current="page"] svg{animation:tabhop .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes tabhop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-5px) scale(1.12)}100%{transform:none}}
nav.tabs .add{transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
nav.tabs .add:active{transform:scale(.9) rotate(90deg)}
.toast{animation:toastin .32s cubic-bezier(.2,1.4,.4,1) both}
.toast.top{animation-name:toastdown}
@keyframes toastin{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes toastdown{from{transform:translateY(-24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
/* the balance flashes green or red when it changes */
.flash-up{animation:flashup .9s ease-out}.flash-down{animation:flashdown .9s ease-out}
@keyframes flashup{0%{text-shadow:0 0 0 transparent}30%{color:var(--owed);transform:scale(1.04)}100%{transform:none}}
@keyframes flashdown{0%{text-shadow:0 0 0 transparent}30%{color:var(--owe);transform:scale(1.04)}100%{transform:none}}
/* chores: a tick pops and the row slides away */
.doneanim{animation:doneout .45s .15s cubic-bezier(.4,0,.2,1) both;position:relative}
.doneanim::after{content:"✓";position:absolute;right:18px;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;background:var(--owed);color:#fff;font-weight:800;display:grid;place-items:center;font-size:1.2rem;animation:popin .25s cubic-bezier(.2,1.6,.4,1) both;box-shadow:2px 2px 0 var(--pop)}
@keyframes doneout{to{opacity:.35;transform:translateX(14px)}}
/* settle rows that involve you breathe a little */
.settle.mine .amt{display:inline-block;animation:nudge 2.6s 1s ease-in-out infinite}
@keyframes nudge{0%,88%,100%{transform:none}92%{transform:rotate(-3deg) scale(1.05)}96%{transform:rotate(2deg) scale(1.05)}}
/* your guide reacts: hops when things get better, wobbles when they get worse, and talks when tapped */
.hero.v2 .hart{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hart.react-up{animation:guidehop .7s cubic-bezier(.3,1.5,.5,1)}
.hart.react-down{animation:guidewob .6s ease-in-out}
.hart.poke{animation:guidepoke .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes guidehop{0%,100%{transform:none}35%{transform:translateY(-16px) rotate(-3deg)}60%{transform:translateY(0) scaleY(.96)}}
@keyframes guidewob{0%,100%{transform:none}25%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-2deg)}}
@keyframes guidepoke{0%,100%{transform:none}30%{transform:scale(1.06,.94)}60%{transform:translateY(-8px) scale(.97,1.04)}}
.speech{position:absolute;right:12px;top:12px;max-width:min(62%,250px);background:#fff;color:#14112A;border:2.5px solid #14112A;border-radius:14px;padding:8px 11px;font-size:.84rem;font-weight:600;line-height:1.3;box-shadow:3px 3px 0 #14112A;z-index:3;animation:speechin .3s cubic-bezier(.2,1.5,.4,1) both;pointer-events:none}
.speech::after{content:"";position:absolute;right:42px;bottom:-11px;width:16px;height:16px;background:#fff;border-right:2.5px solid #14112A;border-bottom:2.5px solid #14112A;transform:rotate(45deg) skew(8deg,8deg)}
.speech.out{animation:fadeout .25s both}
@keyframes speechin{from{transform:translateY(8px) scale(.8);opacity:0}to{transform:none;opacity:1}}
/* loading */
.loader{display:grid;place-items:center;gap:14px;padding:80px 0;color:var(--muted);font-weight:600}
.loader .dots{display:flex;gap:8px}.loader .dots i{width:12px;height:12px;border-radius:50%;background:var(--hl);border:2px solid var(--edge);animation:bounce .9s infinite ease-in-out}
.loader .dots i:nth-child(2){animation-delay:.12s}.loader .dots i:nth-child(3){animation-delay:.24s}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}

@media (prefers-reduced-motion:reduce){
  #app>*,#app .card>*,#app .tile,#app .gcard,.sheet,.sheet *,.scrim,.toast,.chart svg *,.catstrip i,.bar i,.tile .spark *,.hart,.speech,.doneanim,.doneanim::after,.settle .amt,nav.tabs .tab svg,.chip,.loader .dots i,.flash-up,.flash-down{animation:none!important;transition:none!important}
  .chart svg .ln,.tile .spark path{stroke-dashoffset:0!important}
}

<nav class="tabs" id="tabs" hidden><div class="in"><div class="brand" aria-hidden="true"><span class="mark">Si</span><span class="word">Split it <small>by Budget it</small></span></div>

/* ================= split engine ================= */
function splitEqual(amount, ids, seed){
  ids = [...new Set(ids)]; const n = ids.length; if(!n || amount<=0) return {};
  const base = Math.floor(amount/n), rem = amount - base*n, out = {}, start = hash(seed||'') % n;
  ids.forEach(id => out[id] = base);
  for(let k=0; k<rem; k++) out[ids[(start+k)%n]]++;
  return out;
}
function splitShares(amount, shares, seed){
  const ids = Object.keys(shares||{}).filter(id => shares[id] > 0);
  const W = ids.reduce((s,id)=>s+shares[id],0); if(!W || amount<=0) return {};
  const raw = ids.map(id => ({id, v: amount*shares[id]/W})), out = {}; let used = 0;
  raw.forEach(r => { out[r.id] = Math.floor(r.v); used += out[r.id]; });
  raw.sort((a,b)=> ((b.v%1)-(a.v%1)) || (hash(a.id+seed)-hash(b.id+seed))).slice(0, amount-used).forEach(r => out[r.id]++);
  return out;
}
function itemsSplit(amount, input, seed){
  const sub = {}; let itemsTotal = 0;
  (input?.items||[]).forEach((it,i) => { if(!it.p || !it.ids?.length) return; itemsTotal += it.p; for(const [k,v] of Object.entries(splitEqual(it.p, it.ids, seed+'#'+i))) sub[k]=(sub[k]||0)+v; });
  const extra = Math.max(0, amount - itemsTotal), add = splitShares(extra, sub, seed+'x'), out = {...sub};
  for(const [k,v] of Object.entries(add)) out[k]=(out[k]||0)+v;
  return out;
}
function computeSplit(amount, mode, input, seed){
  if(mode==='items') return itemsSplit(amount, input, seed);
  if(mode==='pct') return splitShares(amount, input?.pct, seed);
  if(mode==='shares') return splitShares(amount, input?.shares, seed);
  if(mode==='exact'){ const o={}; for(const [k,v] of Object.entries(input?.exact||{})) if(v>0) o[k]=v; return o; }
  return splitEqual(amount, input?.ids||[], seed);
}
function normEntry(d, id, priv){
  const e = {...d, _id:id, _priv:!!priv};
  if(e.kind !== 'payment' && !e.splitMode){
    const ids = Object.keys(e.split||{}), n = ids.length, b = n ? Math.floor(e.amount/n) : 0;
    if(n && ids.every(i=>Math.abs((e.split[i]||0)-b)<=1) && sumOf(e.split)===e.amount){ e.splitMode='equal'; e.splitInput={ids}; }
    else { e.splitMode='exact'; e.splitInput={exact:{...(e.split||{})}}; }
  }
  if(!e.people) e.people = e.kind==='payment' ? [e.from, e.to] : [...new Set([e.paidBy, ...Object.keys(e.split||{})])];
  return e;
}
function normBill(d, id){
  const r = {...d, _id:id};
  if(!r.splitMode){
    if(r.mode==='exact' && r.exact){ r.splitMode='exact'; r.splitInput={exact:{...r.exact}}; }
    else if(r.mode==='shares'){ r.splitMode='shares'; r.splitInput={shares:{...(r.weights||{})}}; }
    else { r.splitMode='equal'; r.splitInput={ids:Object.keys(r.weights||{})}; }
  }
  return r;
}

function netOf(list){
  const net = {};
  for(const e of counts(list)){
    if(e.kind === 'payment' && e.confirmed === false) continue;   // pending until the other person confirms
    if(e.kind === 'payment'){ net[e.from]=(net[e.from]||0)+e.amount; net[e.to]=(net[e.to]||0)-e.amount; continue; }
    net[e.paidBy] = (net[e.paidBy]||0) + e.amount;
    for(const [id,c] of Object.entries(e.split||{})) net[id] = (net[id]||0) - c;
  }
  return net;
}
function pairwiseOf(list){
  const owe = {};
  const add = (a,b,c) => { if(a===b||!c) return; const k = a<b ? a+'|'+b : b+'|'+a, s = a<b ? 1 : -1; owe[k]=(owe[k]||0)+s*c; };
  for(const e of counts(list)){
    if(e.kind==='payment'){ if(e.confirmed!==false) add(e.to, e.from, e.amount); continue; }
    for(const [id,c] of Object.entries(e.split||{})) add(id, e.paidBy, c);
  }
  const plan = [];
  for(const [k,v] of Object.entries(owe)){ if(!v) continue; const [a,b]=k.split('|'); plan.push(v>0?{from:a,to:b,amount:v}:{from:b,to:a,amount:-v}); }
  return plan.sort((x,y)=>y.amount-x.amount);
}
function simplified(net){
  const cred = [], debt = [];
  for(const [id,v] of Object.entries(net)){ if(v>0) cred.push({id,v}); else if(v<0) debt.push({id,v:-v}); }
  cred.sort((a,b)=>b.v-a.v||a.id.localeCompare(b.id)); debt.sort((a,b)=>b.v-a.v||a.id.localeCompare(b.id));
  const plan = []; let i=0,j=0;
  while(i<debt.length && j<cred.length){
    const amt = Math.min(debt[i].v, cred[j].v);
    if(amt>0) plan.push({from:debt[i].id, to:cred[j].id, amount:amt});
    debt[i].v-=amt; cred[j].v-=amt; if(!debt[i].v) i++; if(!cred[j].v) j++;
  }
  return plan;
}

// A bill repeats every month (default), week or year. Each time it's due has a key that goes in the
// expense id (r_<bill>_<key>): the month "2026-03", the day "2026-03-09" for weekly, the year "2026".
// The laptop server uses the same rules, so whichever posts first wins and the other skips it.
const addDaysS = (d, n) => { const x = new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return dateStr(x); };
const billFirstKey = r => r.every==='week' ? (r.startDate||null) : r.every==='year' ? (r.startMonth||'').slice(0,4)||null : (r.startMonth || (r.createdAt ? ymOf(new Date(r.createdAt)) : ymOf(new Date())));
const billNextKey = (r, k) => r.every==='week' ? addDaysS(k, 7) : r.every==='year' ? String(+k+1) : nextYm(k);
const billDate = (r, k) => { if(r.every==='week') return k; if(r.every==='year'){ const ym = `${k}-${pad(r.month||1)}`; return `${ym}-${pad(dueDay(r, ym))}`; } return `${k}-${pad(dueDay(r, k))}`; };

function nextDue(r){
  const t = new Date(); t.setHours(12,0,0,0); const td = today();
  let key = r.lastPosted ? billNextKey(r, r.lastPosted) : billFirstKey(r);
  let ds = key ? billDate(r, key) : td, n = 0;
  while(key && ds < td && n++ < 400){ key = billNextKey(r, key); ds = billDate(r, key); }

}

const lastDueKey = r => { let key = billFirstKey(r), last = null, n = 0; const td = today();

async function write(fn, quiet){
  try{ await fn(); return true; }
  catch(e){
    if(e?.code==='invalid_argument'){ if(!quiet) toast('You don’t have permission to change that'); }
    else if(e?.code==='failed_precondition'){ if(!quiet) toast(e.message || 'That can’t be saved as it is'); }
    else if(e?.code==='unavailable'){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); try{ await fn(); return true; }catch(_){ if(!quiet) toast('Couldn’t save. Check your connection'); } }
    else if(e?.code==='quota_exceeded'){ if(!quiet) toast('Storage is full. Delete old entries to make room'); }
    else if(!quiet) toast('Couldn’t save. Try again');
    return false;
  }
}

const shownNums = {}; let lastNet = null;
function animateNums(root, fresh){
  const jobs = [];
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, key = el.dataset.ck, had = !!key && key in shownNums;
    const from = fresh || !had ? 0 : shownNums[key]; if(key) shownNums[key] = to;
    if(reduceMotion || from === to) return;
    const fmtv = v => v === 0 && el.dataset.zero ? el.dataset.zero : el.dataset.fmt === 'big' ? bigMoney(v) : el.dataset.fmt === 'tile' ? tileMoney(v) : esc(money(Math.abs(v)));
    if(had && !fresh){
      const good = (to - from) * (+el.dataset.good || 1) > 0;
      el.classList.remove('flash-up','flash-down'); void el.offsetWidth; el.classList.add(good ? 'flash-up' : 'flash-down');
      const g = el.closest('.hero')?.querySelector('.hart');
      if(g){ g.classList.remove('react-up','react-down','poke'); void g.offsetWidth; g.classList.add(good ? 'react-up' : 'react-down'); }
    }
    jobs.push({el, from, to, fmtv});
  });
  if(!jobs.length) return;
  const t0 = performance.now(), dur = 850, ease = x => 1 - Math.pow(1 - x, 3);
  const step = now => { const k = Math.min(1, (now - t0) / dur);
    jobs.forEach(j => { if(j.el.isConnected) j.el.innerHTML = j.fmtv(k >= 1 ? j.to : Math.round(j.from + (j.to - j.from) * ease(k))); });
    if(k < 1 && jobs.some(j => j.el.isConnected)) requestAnimationFrame(step); };

async function api(path, body, method){
  const r = await fetch(path, { method: method || (body ? 'POST' : 'GET'), credentials:'same-origin', headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || 'That didn’t work. Try again.');
  return d;
}

// a second tap confirms, so nothing happens by accident (no pop-up dialogs)
function confirmTap(btn, msg){
  if(btn.dataset.armed){ return true; }
  btn.dataset.armed = '1'; const was = btn.textContent; btn.textContent = msg;
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = was; }, 4000); return false;
}

/* ================= phone app: install + notifications ================= */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1);
const isPhone = () => matchMedia('(pointer: coarse)').matches;
let swReg = null, installEvt = null, pushPeople = new Set();
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; schedule(); });
window.addEventListener('appinstalled', () => { installEvt = null; schedule(); });
async function startPhoneApp(){
  if(!LAPTOP) return;
  if('serviceWorker' in navigator){ try{ swReg = await navigator.serviceWorker.register('/sw.js'); }catch(e){ console.warn('service worker', e); } }
  loadPushPeople();
}
function loadPushPeople(){ fetch('/api/push/who').then(r=>r.ok?r.json():{uids:[]}).then(j => { pushPeople = new Set(j.uids||[]); }).catch(()=>{}); }
const b64ToBytes = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); const b = atob(s + '==='.slice((s.length+3)%4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushStatus(){
  if(!swReg || !('PushManager' in window) || !('Notification' in window)) return isIOS() && !isStandalone() ? 'ios-install' : 'unsupported';
  if(Notification.permission === 'denied') return 'denied';
  const sub = await swReg.pushManager.getSubscription().catch(()=>null);
  return sub && Notification.permission === 'granted' ? 'on' : 'off';
}
async function pushOn(){
  const perm = await Notification.requestPermission(); if(perm !== 'granted') return false;
  const {key} = await (await fetch('/api/push/key')).json();
  let sub = await swReg.pushManager.getSubscription();
  if(!sub) sub = await swReg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(key)});
  const r = await fetch('/api/push/subscribe', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(sub.toJSON())});
  loadPushPeople(); return r.ok;
}
async function pushOff(){
  const sub = await swReg?.pushManager.getSubscription(); if(!sub) return;
  await fetch('/api/push/unsubscribe', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({endpoint:sub.endpoint})});
  await sub.unsubscribe(); loadPushPeople();
}
async function drawPushBox(box){

  if(st==='ios-install') box.innerHTML = `<b>Add it to your home screen first</b><small>On iPhone, tap Share, then “Add to Home Screen”. Open Split it from there and turn notifications on here.</small>`;
  else if(st==='unsupported') box.innerHTML = `<b>Not available in this browser</b><small>Try Chrome on Android, or the home screen app on iPhone.</small>`;
  else if(st==='denied') box.innerHTML = `<b>Notifications are blocked</b><small>Allow them for this site in your phone’s settings, then come back here.</small>`;

/* ================= last time it cost ================= */
function lastCost(title, exceptId, moneyIn){
  const t = (title||'').trim().toLowerCase(); if(t.length < 3) return null;
  const all = alive(S.expensesRaw).concat(alive(S.privEntries)).filter(e => e.kind!=='payment' && e._id!==exceptId && e.amount && e.status!=='needs_amount' && (e.amount < 0) === !!moneyIn)
    .map(e => e.amount < 0 ? {...e, amount: -e.amount} : e);
  const same = all.filter(e => (e.title||'').trim().toLowerCase() === t);
  const pool = same.length ? same : all.filter(e => (e.title||'').toLowerCase().split(' ')[0] === t.split(' ')[0] && t.split(' ')[0].length >= 4);
  if(!pool.length) return null;
  pool.sort(byDate); const last = pool[0];
  const avg = pool.length >= 3 ? Math.round(pool.slice(0,6).reduce((s,e)=>s+e.amount,0) / Math.min(6,pool.length)) : null;
  return { last, avg, n: pool.length };
}

/* ================= whose turn to pay ================= */
// Who should buy next: everyday shared buys over the last 90 days (rent and bills left out,
// since one person often pays those for everyone). Lowest "paid minus share" goes next.
function nextPayer(gid){
  const mem = activeIn(gid).map(m=>m.id); if(mem.length < 2) return null;
  const since = addDays(today(), -90), net = {}; mem.forEach(id => net[id] = 0);
  counts(groupEntries(gid)).filter(e => e.kind!=='payment' && !isBillish(e) && (e.date||'') >= since).forEach(e => {
    if(e.paidBy in net) net[e.paidBy] += e.amount;
    for(const [id,c] of Object.entries(e.split||{})) if(id in net) net[id] -= c; });
  const rows = mem.map(id => ({id, v: net[id]})).sort((a,b)=>a.v-b.v);
  if(rows[0].v > -500 || rows[rows.length-1].v - rows[0].v < 1000) return {even:true};
  return {id: rows[0].id, behind: -rows[0].v};
}
// Payments I marked as paid that the other person hasn't confirmed yet.
function waitingNote(filter){
  const p = alive(S.expensesRaw).filter(e => e.kind==='payment' && e.confirmed===false && (e.from===myUid || e.to===myUid) && filter(e));
  const out = p.filter(e=>e.from===myUid), inn = p.filter(e=>e.to===myUid);
  const parts = [];
  const sumBy = (l, k) => { const m = {}; l.forEach(e => m[e[k]] = (m[e[k]]||0) + e.amount); return Object.entries(m); };
  if(out.length) parts.push(`${sumBy(out,'to').map(([id,a])=>`${money(a)} pending to ${esc(firstName(id))}`).join(', ')}. It counts once they confirm they got it.`);
  if(inn.length) parts.push(`${sumBy(inn,'from').map(([id,a])=>`${money(a)} pending from ${esc(firstName(id))}`).join(', ')}. Confirm it once you’ve got it.`);
  return parts.length ? `<p class="note waiting">${icon('clock','tiny')} ${parts.join(' ')}</p>` : '';
}

/* ================= people already on Split it, and history logged before someone joined (laptop version) =================
   @tags and friend requests: find someone by their exact @tag or checked email, and they accept.
   A friend link (or its QR code) adds you both right away: sharing it is the yes.
   Hand-overs: a contact or a name-only group member you logged things for becomes a real person on the app.
   You send it as a personal invite link or as a request; they see what's waiting and say yes or "not me".
   The server moves it all in one step, checks every balance stays the same, and either of you can undo it for 7 days. */
const BIG_HOUSE = 15;   // more people than this, and Add a friend searches by tag instead of listing everyone
S.inbox = { claims:[], sent:[], got:[], freqIn:[], freqOut:[], invites:[], at:0 };
async function loadInbox(force){
  if(!LAPTOP || !myUid || (!force && Date.now() - S.inbox.at < 15000)) return;
  S.inbox.at = Date.now();
  try{
    const [c, f] = await Promise.all([api('/api/claims'), api('/api/friends/requests')]);
    const sig = JSON.stringify([c.incoming.map(x=>x.id+x.status), f.incoming.map(x=>x.id)]);
    const was = S.inbox.sig;
    Object.assign(S.inbox, { claims:c.incoming, sent:c.sent, got:c.got, freqIn:f.incoming, freqOut:f.outgoing, sig });
    if(sig !== was) schedule();
  }catch(e){}
}

  const you = v => v>0 ? `you’re owed ${money(v)}` : v<0 ? `you owe ${money(-v)}` : 'settled';
  const parts = [...(pv.groups||[]).map(g => `<div class="row"><div class="body"><div class="t ell">${esc(g.name)}</div><div class="m">${plural(g.entries,'entry','entries')} as “${esc(g.as)}”. You join the group.</div></div><div class="r"><b class="${amtClass(g.balance)}">${you(g.balance)}</b></div></div>`),
    pv.oneOnOne ? `<div class="row"><div class="body"><div class="t">Just you and ${esc(c.byName)}</div><div class="m">${plural(pv.oneOnOne.expenses,'expense')}${pv.oneOnOne.payments?`, ${plural(pv.oneOnOne.payments,'payment')}`:''}${pv.oneOnOne.carried?`, plus one “carried over” line for ${plural(pv.oneOnOne.carried,'expense')} with other people`:''}</div></div><div class="r"><b class="${amtClass(pv.oneOnOne.balance)}">${you(pv.oneOnOne.balance)}</b></div></div>` : ''].join('');
  openSheet(head('Is this you?') + `<div class="pair">${av(c.by,'lg')}<div><div style="font-weight:600">${esc(c.byName)} logged this for “${esc(c.name)}”</div><div class="note" style="margin:2px 0 0">before you were on Split it</div></div></div>
    <div class="card" style="margin-top:12px">${parts}</div>
    <p style="margin:14px 2px 4px;font-weight:700">Altogether, ${you(pv.total||0)}</p>
    <label class="f">What moves to you (${pv.count})</label>
    <div class="card">${(pv.items||[]).map(i => `<div class="row"><div class="body"><div class="t ell">${esc(i.title)}</div><div class="m">${esc(i.date)} · ${esc(i.where)}${i.photo?' · receipt':''}</div></div><div class="r"><b>${money(i.amount)}</b>${i.yours?`<small class="${amtClass(i.kind==='payment'?i.yours:-i.yours)}">${i.kind==='payment'?(i.yours>0?'you paid':'paid to you'):'your share '+money(Math.abs(i.yours))}</small>`:''}</div></div>`).join('')}</div>
    ${pv.count > (pv.items||[]).length ? `<p class="note">And ${pv.count - pv.items.length} more.</p>` : ''}
    <p class="note">Yes moves all of it to your account, and ${esc(c.byName)} sees the same balances you do. Either of you can undo it for 7 days. If it isn’t you, nothing moves.</p>
    <div class="foot"><button class="btn" id="no">Not me</button><button class="btn primary" id="yes">Yes, that’s me</button></div>`, sh => {
    sh.querySelector('#no').onclick = async e => { if(!confirmTap(e.currentTarget, 'Tap again: it’s not me')) return;
      try{ await api('/api/claims/answer', { id:c.id, yes:false }); closeSheet(); toast(`Got it. We told ${c.byName}`); }catch(x){ toast(x.message); } loadInbox(true); };
    sh.querySelector('#yes').onclick = async e => { const b = e.currentTarget; b.disabled = true; b.textContent = 'Moving it…';
      try{ await api('/api/claims/answer', { id:c.id, yes:true }); closeSheet(); celebrate('It’s all yours now'); }
      catch(x){ toast(x.message); b.disabled = false; b.textContent = 'Yes, that’s me'; } loadInbox(true); };
  });
}

/* -------- handing history over: from a contact's page or a name-only group member -------- */
function openHandOver({ contact, guest, to } = {}){
  if(!LAPTOP) return;
  const base = contact ? (S.privFriends.find(f=>f.id===contact)?.name||'') : (groupMembers(guest.gid).find(m=>m.id===guest.id)?.name||'');
  const first = base.split(' ')[0].toLowerCase();
  // every name-only record you have for that first name, so one hand-over covers them all
  const opts = [...S.privFriends.filter(f=>f.kind==='contact' && (f.id===contact || f.name.split(' ')[0].toLowerCase()===first)).map(f=>({key:'c:'+f.id, label:`${f.name}, your private contact`, contact:f.id, on:!guest || f.id===contact})),
    ...myGroups().filter(g => groupMembers(g.id).some(m=>m.id===myUid && m.kind==='account'))
      .flatMap(g => groupMembers(g.id).filter(m => m.kind==='guest' && (guest ? (m.id===guest.id && g.id===guest.gid) || (m.name||'').split(' ')[0].toLowerCase()===first : (m.name||'').split(' ')[0].toLowerCase()===first))
      .map(m => ({key:`g:${g.id}:${m.id}`, label:`${m.name} in ${g.name}`, guest:{gid:g.id, id:m.id}, on:true})))];
  const seenG = new Set(); for(const o of opts) if(o.guest){ if(seenG.has(o.guest.gid)) o.on = false; seenG.add(o.guest.gid); }
  let target = to || null;
  const pick = () => { const sel = opts.filter(o=>o.on); return { contact: sel.find(o=>o.contact)?.contact, guests: sel.filter(o=>o.guest).map(o=>o.guest) }; };
  openSheet(head(`Hand over ${esc(base)}’s history`) + `<p style="margin:0 0 6px">When ${esc(base)} joins, or if they’re already on Split it, they can take over what you logged for them. They say yes first.</p>
    <label class="f">What it covers</label><div class="chips" id="hoOpts">${opts.map((o,i)=>`<button class="chip" data-ho="${i}" aria-pressed="${o.on}">${esc(o.label)}</button>`).join('')}</div>
    <div id="hoPrev" class="note" aria-live="polite">Checking…</div>
    <label class="f">Who gets it</label><div class="seg" id="hoHow"><button data-how="link" aria-pressed="${!target}">Not on Split it yet</button><button data-how="acct" aria-pressed="${!!target}">On Split it</button></div>
    <div id="hoBody"></div>`, sh => {
    const prevBox = sh.querySelector('#hoPrev'), body = sh.querySelector('#hoBody');
    let how = target ? 'acct' : 'link';
    const preview = async () => { const t = pick(); if(!t.contact && !t.guests.length){ prevBox.textContent = 'Pick at least one.'; return; }
      try{ const d = await api('/api/claims', { ...t, dry:true }), pv = d.preview;
        const notes = pv.oneOnOne && (pv.oneOnOne.notes || pv.oneOnOne.photos);
        prevBox.innerHTML = `They’ll see <b>${plural(pv.count,'entry','entries')}</b>${pv.groups.length?` and join ${esc(pv.groups.map(g=>g.name).join(', '))}`:''}. ${pv.total<0?`They owe ${money(-pv.total)} in all.`:pv.total>0?`They’re owed ${money(pv.total)} in all.`:'They’re settled.'}${notes?' Notes and receipt photos on your one-on-ones go with them.':''}${pv.oneOnOne?.carried?` ${plural(pv.oneOnOne.carried,'expense')} with other people too ${pv.oneOnOne.carried===1?'stays':'stay'} yours, and they get one “carried over” line for their part.`:''}`;
      }catch(x){ prevBox.textContent = x.message; } };
    const drawBody = () => {
      if(how === 'link'){ body.innerHTML = `<p class="note" style="margin-top:0">You get a link for ${esc(base)}. They make an account with it and see what’s waiting. It works once, for 7 days.</p>
          <button class="btn primary block" id="hoLink">Make the invite link</button>`;
        body.querySelector('#hoLink').onclick = async e => { const b = e.currentTarget; b.disabled = true;
          try{ const d = await api('/api/claims', { ...pick(), link:true }), url = location.origin + '/join#t=' + d.token;
            const msg = `Join me on Split it. What we’ve split so far is waiting for you: ${url}`;
            body.innerHTML = linkBox(url, msg, `Works once, for the next 7 days. Nothing moves until ${esc(base)} says yes.`); bindLinkBox(body, url, msg);
            sh.querySelectorAll('[data-ho],[data-how]').forEach(x=>x.disabled = true); loadInbox(true);
          }catch(x){ toast(x.message); b.disabled = false; } };
        return; }
      const near = Object.keys(S.people).filter(id => id!==myUid && firstName(id).toLowerCase()===first);
      body.innerHTML = `${near.length?`<div class="chips">${near.map(id=>`<button class="chip" data-to="${esc(id)}" aria-pressed="${id===target}">${av(id,'sm')}${esc(nameOf(id))}</button>`).join('')}</div>`:''}
        <div class="cbox" style="margin-top:8px"><label for="hoQ" class="sr">Their @tag or email</label><input class="in" id="hoQ" placeholder="@tag or email" autocapitalize="off" autocomplete="off"><button class="btn" id="hoFind">Find</button></div>
        <p class="note" id="hoWho">${target?`Sending to ${esc(nameOf(target))}.`:'Pick them, or type their @tag. They can find it in their profile.'}</p>
        <button class="btn primary block" id="hoSend" ${target?'':'disabled'}>Send it to them</button>`;
      const setTo = (id, label) => { target = id; body.querySelector('#hoWho').textContent = `Sending to ${label||nameOf(id)}.`; body.querySelector('#hoSend').disabled = false;
        body.querySelectorAll('[data-to]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.to===id)); };
      body.querySelectorAll('[data-to]').forEach(x => x.onclick = () => setTo(x.dataset.to));
      const find = async () => { const q = body.querySelector('#hoQ').value.trim(); if(!q) return;
        try{ const d = await api('/api/people/find', { q }); setTo(d.uid, `${d.name} (@${d.tag})`); }catch(x){ body.querySelector('#hoWho').textContent = x.message; } };
      body.querySelector('#hoFind').onclick = find; body.querySelector('#hoQ').onkeydown = ev => { if(ev.key==='Enter'){ ev.preventDefault(); find(); } };
      body.querySelector('#hoSend').onclick = async e => { const b = e.currentTarget; b.disabled = true;
        try{ await api('/api/claims', { ...pick(), to:target }); closeSheet(); toast(`Sent. ${nameOf(target)} says yes or no next time they open Split it`); loadInbox(true); }
        catch(x){ toast(x.message); b.disabled = false; } };
    };
    sh.querySelectorAll('[data-ho]').forEach(b => b.onclick = () => { const o = opts[+b.dataset.ho]; o.on = !o.on;
      if(o.on && o.guest) opts.forEach(x => { if(x!==o && x.guest && x.guest.gid===o.guest.gid) x.on = false; });
      if(o.on && o.contact) opts.forEach(x => { if(x!==o && x.contact) x.on = false; });
      sh.querySelectorAll('[data-ho]').forEach(x => x.setAttribute('aria-pressed', opts[+x.dataset.ho].on)); preview(); });
    sh.querySelectorAll('[data-how]').forEach(b => b.onclick = () => { how = b.dataset.how; sh.querySelectorAll('[data-how]').forEach(x=>x.setAttribute('aria-pressed', x===b)); drawBody(); });
    preview(); drawBody();
  });
}
