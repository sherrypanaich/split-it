name: List in the MCP registry
# Run it from the Actions tab after a release. It publishes server.json to the
# official MCP registry (registry.modelcontextprotocol.io) so AI assistants and
# directories can find this app. Signs in with GitHub, no secrets needed.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the MCP publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Sign in with GitHub
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
