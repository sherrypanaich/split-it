name: Release
# Push a tag like v2.1.0, or run it from the Actions tab with a version, and this
# publishes a GitHub Release (and the tag, if it doesn't exist yet) whose notes are
# that version's section of CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like v2.1.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull this version's notes out of CHANGELOG.md
        run: |
          awk -v v="## ${VERSION} " 'index($0, v) == 1 {on=1; next} /^## v/ {if (on) exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No section for ${VERSION} in CHANGELOG.md"; exit 1; }
      - name: Docker smoke test (build, start, add a person, sign in, restart, data still there)
        run: |
          if command -v docker >/dev/null && docker info >/dev/null 2>&1; then
            scripts/smoke-docker.sh
          else
            echo "::warning::Docker is not available on this runner, so the Docker smoke test was skipped"
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Split it ${VERSION}: $(grep -m1 -o '^\*\*[^*]*\*\*' notes.md | tr -d '*' | sed 's/\.$//')"
          gh release create "${VERSION}" --title "$title" --notes-file notes.md --target "$GITHUB_SHA"
