name: Release
# Push a tag like v2.1.0 and this publishes a GitHub Release whose notes are
# that version's section of CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull this version's notes out of CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME} " 'index($0, v) == 1 {on=1; next} /^## v/ {if (on) exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No section for ${GITHUB_REF_NAME} in CHANGELOG.md"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Split it ${GITHUB_REF_NAME}: $(grep -m1 -o '^\*\*[^*]*\*\*' notes.md | tr -d '*' | sed 's/\.$//')"
          gh release create "${GITHUB_REF_NAME}" --title "$title" --notes-file notes.md --verify-tag
