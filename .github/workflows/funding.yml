name: Update funding total
on:
  schedule:
    - cron: '17 * * * *'   # every hour
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-funding.mjs
        env:
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
          SPONSORS_LOGIN: ${{ vars.SPONSORS_LOGIN }}
          START_MONTH: ${{ vars.START_MONTH }}
      - name: Commit if changed
        run: |
          if git diff --quiet docs/funding.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/funding.json
          git commit -m "Update funding total"
          git push
